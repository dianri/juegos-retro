<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Space Invaders — Arcade</title>
<style>
  :root { --neon:#4cc2ff; --bg:#0b0f1a; }
  * { box-sizing:border-box; margin:0; padding:0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #16203a 0%, #0b0f1a 60%);
    font-family: 'Courier New', ui-monospace, monospace;
    color: #e8ecf5;
    padding: 6px;
  }

  .cabina {
    width: 100%;
    max-width: 864px;
    max-height: 100vh;
    max-height: 100dvh;
    padding: 12px 16px 10px;
    border: 2px solid rgba(76,194,255,.35);
    border-radius: 14px;
    background: #0d1220;
    box-shadow: 0 0 40px rgba(76,194,255,.15), inset 0 0 60px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  h1 {
    font-size: clamp(15px, 3vw, 21px);
    letter-spacing: clamp(2px, 0.8vw, 5px);
    color: var(--neon);
    text-shadow: 0 0 12px rgba(76,194,255,.6);
    margin-bottom: 8px;
    text-align: center;
    white-space: nowrap;
  }

  .canvas-wrapper {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 auto;
    min-height: 0;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    max-width: 800px;
    max-height: calc(100dvh - 120px);
    aspect-ratio: 800 / 600;
    object-fit: contain;
    border-radius: 10px;
    background: #05070d;
    touch-action: none;
  }

  .hud {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 6px 12px;
    margin-top: 8px;
    font-size: clamp(11px, 2.2vw, 14px);
    letter-spacing: 1px;
  }

  .hud b { color: var(--neon); }
  .vidas { color: #ff2e63; letter-spacing: 3px; text-shadow: 0 0 8px rgba(255,46,99,.5); }
  .record { color: #ffd23f; }
  .powerups {
    margin-top: 4px;
    font-size: clamp(10px, 2vw, 12px);
    letter-spacing: 1px;
    color: #3ddc97;
    min-height: 16px;
    text-align: center;
    width: 100%;
  }

  .controls {
    margin-top: 6px;
    font-size: clamp(9px, 1.8vw, 11px);
    color: #8b97ad;
    text-align: center;
    line-height: 1.3;
    width: 100%;
  }

  button {
    background: transparent;
    border: 1px solid var(--neon);
    color: var(--neon);
    font-family: inherit;
    font-size: clamp(10px, 2vw, 12px);
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    touch-action: manipulation;
  }

  button:hover { background: rgba(76,194,255,.12); }
  button.destacado {
    border-color: #ffd23f;
    color: #ffd23f;
    text-shadow: 0 0 10px rgba(255,210,63,.6);
    background: rgba(255,210,63,.10);
  }

  @media (max-height: 540px) {
    body { padding: 2px; }
    .cabina {
      padding: 4px 8px;
      border-width: 1px;
      border-radius: 8px;
    }
    h1 {
      font-size: 12px;
      letter-spacing: 1.5px;
      margin-bottom: 2px;
    }
    canvas {
      max-height: calc(100dvh - 64px);
    }
    .hud {
      margin-top: 2px;
      gap: 3px 6px;
      font-size: 10px;
      letter-spacing: 0.5px;
    }
    .powerups {
      margin-top: 1px;
      min-height: 12px;
      font-size: 9px;
    }
    .controls { display: none; }
    button { padding: 2px 6px; font-size: 9px; }
  }
</style>
</head>
<body>
<div class="cabina">
  <h1>SPACE INVADERS</h1>
  <div class="canvas-wrapper">
    <canvas id="game" width="800" height="600"></canvas>
  </div>
  <div class="hud">
    <div>PUNTOS: <b id="score">0</b></div>
    <div>RÉCORD: <b class="record" id="highscore">0</b></div>
    <div>NIVEL MÁX: <b class="record" id="maxlevel">1</b></div>
    <div>ENEMIGOS: <b id="enemies">0</b></div>
    <div class="vidas" id="lives">♥♥♥</div>
    <div>NIVEL: <b id="level">1</b></div>
    <button id="btnRestart">REINICIAR NIVEL</button>
  </div>
  <div class="powerups" id="powerups"></div>
  <div class="controls">← / →, A / D, ratón o táctil · ESPACIO / CLIC: disparar · P o ESC: pausa · C: continuar nivel · R: reiniciar</div>
</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const elScore = document.getElementById('score');
const elHigh = document.getElementById('highscore');
const elMax = document.getElementById('maxlevel');
const elEnemies = document.getElementById('enemies');
const elLives = document.getElementById('lives');
const elLevel = document.getElementById('level');
const elPower = document.getElementById('powerups');

// ---------- Audio procedural ----------
let audioCtx = null;
function resumeAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function beep(freq, dur = 0.06, vol = 0.12, type = 'square') {
  try {
    resumeAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* silencio si el navegador bloquea el audio */ }
}
function sweep(f0, f1, dur, vol = 0.15, type = 'sawtooth') {
  try {
    resumeAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f1, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function noise(dur = 0.25, vol = 0.18) {
  try {
    resumeAudio();
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1100;
    const g = audioCtx.createGain();
    g.gain.value = vol;
    src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
    src.start();
  } catch (e) {}
}
function arpeggio() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.14, 0.12, 'triangle'), i * 70));
}
function fanfare() {
  [523, 659, 784, 1047, 1319, 1047, 784, 1047, 1319, 1568, 1047]
    .forEach((f, i) => setTimeout(() => beep(f, 0.28, 0.14, 'triangle'), i * 130));
}
const PU_SOUND = {
  triple: () => { sweep(300, 900, 0.22); beep(1200, 0.09, 0.1, 'triangle'); },
  laser:  () => { sweep(800, 1500, 0.16, 0.12, 'square'); beep(1700, 0.07, 0.1, 'square'); },
  shield: () => { sweep(180, 700, 0.3, 0.15, 'triangle'); },
  rapid:  () => { sweep(500, 1200, 0.12, 0.12, 'square'); beep(1400, 0.06, 0.1, 'square'); },
};

// ---------- Constantes ----------
const SHIP_W = 46, SHIP_H = 26, SHIP_Y = H - 52;
const ALIEN_W = 40, ALIEN_H = 30, CELL_W = 54, CELL_H = 44;
const FORM_TOP = 90, INVASION_Y = 500;
const COLORS = ['#ff2e63', '#ff6b35', '#ffd23f', '#3ddc97', '#4cc2ff', '#a78bfa'];const PU_TYPES = ['triple', 'laser', 'shield', 'rapid'];
const PU_LABEL = { triple: 'DISPARO TRIPLE', laser: 'LÁSER', shield: 'ESCUDO', rapid: 'CADENCIA RÁPIDA' };
const PU_COLOR = { triple: '#4cc2ff', laser: '#ff2e63', shield: '#3ddc97', rapid: '#ffd23f' };
const PU_ICON = { triple: '≡', laser: '⚡', shield: '◉', rapid: '»' };

// Sprites pixel-art de los invasores (11 x 8)
const SPRITES = {
  1: [
    '00100000100',
    '00010001000',
    '00111111100',
    '01101110110',
    '11111111111',
    '10111111101',
    '10100000101',
    '00011011000',
  ],
  2: [
    '00011111000',
    '01111111110',
    '11111111111',
    '11011111011',
    '11111111111',
    '00111011100',
    '01000100010',
    '10000000001',
  ],
  3: [
    '00001110000',
    '00111111100',
    '01111111110',
    '11011111011',
    '11111111111',
    '00100000100',
    '01010000101',
    '10100000101',
  ],
};
const ALIEN_COLOR = { 1: '#4cc2ff', 2: '#ff2e63', 3: '#ffd23f' };

// PRNG determinista (mulberry32): mismo nivel -> mismos power-ups
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Niveles ----------
const LEVELS = [
  { name: 'NIVEL 1 — PRIMER CONTACTO', cols: 8, rows: 4, speed: 0.55, fire: 95,
    hp: [1, 1, 1, 1], types: [2, 2, 1, 1] },
  { name: 'NIVEL 2 — ENJAMBRE', cols: 8, rows: 4, speed: 0.75, fire: 75,
    hp: [2, 2, 1, 1], types: [2, 2, 1, 1] },
  { name: 'NIVEL 3 — ASALTO', cols: 8, rows: 5, speed: 0.95, fire: 58,
    hp: [2, 2, 1, 1, 1], types: [3, 2, 2, 1, 1] },
  { name: 'NIVEL 4 — NAVE MADRE', boss: true },
];

// ---------- Estado ----------
let state, score, lives, levelIdx, aliens, form, boss, ship;
let pBullets, eBullets, shields, powerups, particles, transition;
let shake, paused, firing, alienFireT, scoreSubmitted;
let puTimers = {};
let highScore = parseInt(localStorage.getItem('si_high') || '0', 10);
let maxLevel = parseInt(localStorage.getItem('si_maxlevel') || '1', 10);
const keys = { left: false, right: false };
let mouseDown = false;
let touching = false;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// Campo de estrellas determinista
const stars = (() => {
  const rng = mulberry32(1337);
  const s = [];
  for (let i = 0; i < 90; i++) {
    s.push({ x: rng() * W, y: rng() * H, r: 0.6 + rng() * 1.5, phase: rng() * Math.PI * 2 });
  }
  return s;
})();

function updateHud() {
  elScore.textContent = score;
  elHigh.textContent = highScore;
  elMax.textContent = maxLevel;
  elLives.textContent = '♥'.repeat(Math.max(0, lives)) + '·'.repeat(Math.max(0, 3 - lives));
  elLevel.textContent = levelIdx + 1;
  const lvl = LEVELS[levelIdx];
  if (lvl.boss) {
    elEnemies.textContent = boss ? Math.max(0, boss.hp) + '/' + boss.maxHp : '—';
  } else {
    elEnemies.textContent = aliens ? aliens.filter(a => a.hp > 0).length : 0;
  }
  const act = Object.keys(puTimers).filter(k => puTimers[k] > 0).map(k => PU_LABEL[k]);
  elPower.textContent = act.length ? 'ACTIVOS: ' + act.join(' · ') : '';
  const btn = document.getElementById('btnRestart');
  if (state === 'gameover') {
    btn.textContent = 'CONTINUAR NIVEL';
    btn.classList.add('destacado');
  } else if (state === 'won') {
    btn.textContent = 'JUGAR DE NUEVO';
    btn.classList.add('destacado');
  } else {
    btn.textContent = 'REINICIAR NIVEL';
    btn.classList.remove('destacado');
  }
}

// ---------- Construcción de niveles ----------
function buildShields() {
  shields = [];
  const bunkers = [136, 306, 476, 646];
  for (const bx of bunkers) {
    for (let r = 0; r < 3; r++) {
      const cols = r === 2 ? 3 : 5;
      const off = r === 2 ? 12 : 0;
      for (let c = 0; c < cols; c++) {
        shields.push({
          x: bx + off + c * 12,
          y: 446 + r * 10,
          w: 11, h: 8, hp: 1,
        });
      }
    }
  }
}

function loadLevel(idx) {
  levelIdx = idx;
  pBullets = [];
  eBullets = [];
  powerups = [];
  particles = [];
  puTimers = {};
  boss = null;
  shields = [];
  transition = null;
  const L = LEVELS[idx];
  buildShields();

  if (L.boss) {
    aliens = [];
    form = null;
    boss = {
      x: W / 2 - 100, y: 70, w: 200, h: 86,
      hp: 45, maxHp: 45, dir: 1, invuln: 0, flash: 0,
      fireT: 90, puT: 520, dying: false, deathTimer: 0,
    };
  } else {
    aliens = [];
    const startX = (W - L.cols * CELL_W) / 2;
    for (let r = 0; r < L.rows; r++) {
      for (let c = 0; c < L.cols; c++) {
        const hp = L.hp[r] || 1;
        aliens.push({
          col: c, row: r,
          type: L.types[r] || 1,
          hp, maxHp: hp,
          points: [30, 20, 20, 10, 10][r] || 10,
          flash: 0, invuln: 0, pu: null,
        });
      }
    }
    form = {
      x: startX, y: FORM_TOP, dir: 1, animT: 0, anim: 0,
    };
    // Reparto determinista de power-ups entre los invasores
    const rng = mulberry32(0x5F3759DF ^ (idx * 2654435761));
    const shuffled = aliens.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    PU_TYPES.forEach((type, i) => { if (shuffled[i]) shuffled[i].pu = type; });
    for (let i = PU_TYPES.length; i < Math.min(shuffled.length, PU_TYPES.length + 2); i++) {
      if (rng() < 0.5) shuffled[i].pu = PU_TYPES[Math.floor(rng() * PU_TYPES.length)];
    }
    alienFireT = 100;
  }

  ship = {
    x: W / 2 - SHIP_W / 2,
    y: SHIP_Y,
    speed: 7.5,
    invuln: 70,
  };
  firing = false;
  fireCd = 0;
  state = 'ready';
  updateHud();
}

function resetGame() {
  score = 0;
  lives = 3;
  shake = 0;
  paused = false;
  scoreSubmitted = false;
  loadLevel(0);
}

function continueLevel() {
  lives = 3;
  scoreSubmitted = false;
  loadLevel(levelIdx);
}

function saveHigh() {
  if (score > highScore) { highScore = score; localStorage.setItem('si_high', highScore); }
}
function saveMaxLevel() {
  const reached = levelIdx + 1;
  if (reached > maxLevel) { maxLevel = reached; localStorage.setItem('si_maxlevel', maxLevel); }
}

function submitScore() {
  if (scoreSubmitted) return;
  scoreSubmitted = true;
  if (window.parent !== window) {
    try {
      window.parent.postMessage({
        type: 'SPACE_INVADERS_SCORE_SUBMISSION',
        score: score || 0,
        game: 'space-invaders'
      }, '*');
    } catch (e) {
      console.warn('Error al enviar la puntuación a la app contenedora:', e);
    }
  }
}

function startWave() {
  state = 'playing';
  alienFireT = 80;
  beep(440, 0.1);
}

// ---------- Partículas ----------
function spawnParticles(x, y, color, n = 12, speedMult = 1, size = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (1 + Math.random() * 3) * speedMult;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - (speedMult > 1 ? 0 : 0.6),
      life: 1,
      decay: 0.012 + Math.random() * 0.018,
      color,
      size: size * (0.6 + Math.random() * 0.8),
    });
  }
}

function addRing(x, y, color, vr = 4) {
  particles.push({ ring: true, x, y, r: 6, vr, lineWidth: 3, life: 1, decay: 0.02, color });
}

function addShake(n) { shake = Math.max(shake, n); }

// ---------- Power-ups ----------
function applyPowerup(type) {
  PU_SOUND[type]();
  puTimers[type] = type === 'shield' ? 720 : 600;
  updateHud();
}

function spawnCapsule(x, y, type) {
  powerups.push({ x, baseX: x, y, type, vy: 2.3, phase: Math.random() * Math.PI * 2 });
}

// ---------- Disparo ----------
function shoot() {
  if (state !== 'playing') return;
  const maxBullets = puTimers.rapid > 0 ? 7 : 5;
  if (pBullets.length >= maxBullets) return;
  const cx = ship.x + SHIP_W / 2;
  const y = ship.y - 8;
  const pierce = puTimers.laser > 0;
  const dmg = pierce ? 2 : 1;
  if (puTimers.triple > 0) {
    for (const vx of [-1.9, 0, 1.9]) {
      pBullets.push({ x: cx - 2, y, vx, vy: -11, pierce, dmg });
    }
  } else {
    pBullets.push({ x: cx - 2, y, vx: 0, vy: -11, pierce, dmg });
  }
  beep(880, 0.035, 0.07, 'square');
}

// ---------- Daños ----------
function damageAlien(a, dmg, hx, hy) {
  if (a.hp <= 0 || a.invuln > 0) return;
  a.hp -= dmg;
  a.invuln = 4;
  a.flash = 4;
  const ax = form.x + a.col * CELL_W;
  const ay = form.y + a.row * CELL_H;
  if (a.hp <= 0) {
    score += a.points;
    spawnParticles(hx || ax + ALIEN_W / 2, hy || ay + ALIEN_H / 2, ALIEN_COLOR[a.type], 16, 1.1, 4);
    beep(320 + a.points * 8, 0.06);
    if (a.pu) {
      arpeggio();
      spawnCapsule(ax + ALIEN_W / 2, ay + ALIEN_H / 2, a.pu);
    }
  } else {
    spawnParticles(hx || ax + ALIEN_W / 2, hy || ay + ALIEN_H / 2, '#ffffff', 6, 0.8, 3);
    beep(620, 0.04, 0.09, 'triangle');
  }
  updateHud();
}

function damageBoss(dmg, hx, hy) {
  if (!boss || boss.dying || boss.invuln > 0) return;
  boss.hp -= dmg;
  boss.invuln = 6;
  boss.flash = 1;
  score += 50 * dmg;
  spawnParticles(hx, hy, '#ff2e63', 12, 1.2, 5);
  addShake(4);
  sweep(240, 100, 0.1, 0.12, 'square');
  updateHud();
  if (boss.hp <= 0) {
    boss.hp = 0;
    boss.dying = true;
    boss.deathTimer = 110;
    eBullets = [];
    addShake(16);
    sweep(180, 50, 0.4, 0.3, 'sawtooth');
  }
}

// El jugador recibe un impacto. Devuelve true si la partida ha terminado.
function playerHit(reason) {
  if (ship.invuln > 0) return false;
  if (puTimers.shield > 0) {
    puTimers.shield = 0;
    ship.invuln = 45;
    addRing(ship.x + SHIP_W / 2, ship.y + SHIP_H / 2, '#3ddc97', 5);
    spawnParticles(ship.x + SHIP_W / 2, ship.y + SHIP_H / 2, '#3ddc97', 18, 1.4, 4);
    sweep(500, 120, 0.3, 0.18, 'triangle');
    updateHud();
    return false;
  }
  lives--;
  addShake(14);
  noise(0.35, 0.22);
  spawnParticles(ship.x + SHIP_W / 2, ship.y + SHIP_H / 2, '#4cc2ff', 26, 1.8, 5);
  spawnParticles(ship.x + SHIP_W / 2, ship.y + SHIP_H / 2, '#ff6b35', 18, 1.4, 6);
  ship.invuln = 120;
  ship.x = W / 2 - SHIP_W / 2;
  eBullets = [];
  puTimers = {};
  updateHud();
  if (lives <= 0) {
    state = 'gameover';
    saveHigh();
    saveMaxLevel();
    submitScore();
    updateHud();
    return true;
  }
  if (reason === 'invasion' && form) {
    form.y = FORM_TOP;
    form.dir *= -1;
  }
  return false;
}

// ---------- Colisiones ----------
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function alienRect(a) {
  return {
    x: form.x + a.col * CELL_W,
    y: form.y + a.row * CELL_H,
    w: ALIEN_W,
    h: ALIEN_H,
  };
}

function updatePlayerBullets() {
  for (const b of pBullets) {
    const steps = Math.max(1, Math.ceil(Math.abs(b.vy) / 6));
    let dead = false;
    for (let s = 0; s < steps && !dead; s++) {
      b.x += b.vx / steps;
      b.y += b.vy / steps;

      // Escudos
      for (const sh of shields) {
        if (sh.hp <= 0) continue;
        if (rectsOverlap(b.x, b.y, 4, 12, sh.x, sh.y, sh.w, sh.h)) {
          sh.hp = 0;
          spawnParticles(sh.x + sh.w / 2, sh.y + sh.h / 2, '#3ddc97', 6, 0.8, 3);
          beep(500, 0.03, 0.07, 'triangle');
          dead = true;
          break;
        }
      }
      if (dead) break;

      // Jefe
      if (boss && !boss.dying && rectsOverlap(b.x, b.y, 4, 12, boss.x, boss.y, boss.w, boss.h)) {
        damageBoss(b.dmg, b.x, b.y);
        if (!b.pierce) { dead = true; break; }
      }

      // Invasores
      if (!boss) {
        const alive = aliens;
        for (const a of alive) {
          if (a.hp <= 0) continue;
          const r = alienRect(a);
          if (rectsOverlap(b.x, b.y, 4, 12, r.x + 3, r.y + 2, ALIEN_W - 6, ALIEN_H - 4)) {
            damageAlien(a, b.dmg, b.x, b.y);
            if (!b.pierce) { dead = true; break; }
          }
        }
      }
    }
    if (dead || b.y < -20 || b.x < -20 || b.x > W + 20) b.dead = true;
  }
  pBullets = pBullets.filter(b => !b.dead);
}

function updateEnemyBullets() {
  for (const b of eBullets) {
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(b.vx), Math.abs(b.vy)) / 6));
    let dead = false;
    for (let s = 0; s < steps && !dead; s++) {
      b.x += b.vx / steps;
      b.y += b.vy / steps;

      for (const sh of shields) {
        if (sh.hp <= 0) continue;
        if (rectsOverlap(b.x - 4, b.y - 4, 8, 8, sh.x, sh.y, sh.w, sh.h)) {
          sh.hp = 0;
          spawnParticles(sh.x + sh.w / 2, sh.y + sh.h / 2, '#3ddc97', 6, 0.8, 3);
          dead = true;
          break;
        }
      }
      if (dead) break;

      // Impacto en la nave (hitbox algo más pequeña que el dibujo)
      const hx = ship.x + 6, hy = ship.y + 6, hw = SHIP_W - 12, hh = SHIP_H - 10;
      if (rectsOverlap(b.x - 4, b.y - 4, 8, 8, hx, hy, hw, hh)) {
        dead = true;
        if (playerHit('bullet')) return;
      }
    }
    if (dead || b.y > H + 20 || b.x < -20 || b.x > W + 20) b.dead = true;
  }
  eBullets = eBullets.filter(b => !b.dead);
}

// ---------- Oleadas ----------
function aliveAliens() {
  return aliens ? aliens.filter(a => a.hp > 0) : [];
}

function formationBounds() {
  let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const a of aliveAliens()) {
    const x = form.x + a.col * CELL_W;
    const y = form.y + a.row * CELL_H;
    minX = Math.min(minX, x);
    maxX = Math.max(maxX, x + ALIEN_W);
    maxY = Math.max(maxY, y + ALIEN_H);
  }
  return { minX, maxX, maxY };
}

function updateFormation() {
  const alive = aliveAliens();
  if (!alive.length) return;
  const total = aliens.length;
  const speed = LEVELS[levelIdx].speed + (1 - alive.length / total) * 1.7;
  form.x += form.dir * speed;
  form.animT++;
  if (form.animT % 26 === 0) form.anim = 1 - form.anim;

  const b = formationBounds();
  if (b.maxX > W - 22) {
    form.x -= (b.maxX - (W - 22));
    form.dir = -1;
    form.y += 16;
    form.anim = 1 - form.anim;
    beep(150, 0.05, 0.08, 'square');
  } else if (b.minX < 22) {
    form.x += (22 - b.minX);
    form.dir = 1;
    form.y += 16;
    form.anim = 1 - form.anim;
    beep(150, 0.05, 0.08, 'square');
  }

  if (b.maxY > INVASION_Y) {
    playerHit('invasion');
  }
}

function updateAlienFire() {
  if (!aliens.length || state !== 'playing') return;
  alienFireT--;
  if (alienFireT > 0) return;
  const L = LEVELS[levelIdx];
  alienFireT = L.fire + Math.floor(Math.random() * 45);

  // Elige el invasor más bajo de una columna aleatoria
  const byCol = new Map();
  for (const a of aliveAliens()) {
    const prev = byCol.get(a.col);
    if (!prev || a.row > prev.row) byCol.set(a.col, a);
  }
  const candidates = [...byCol.values()];
  if (!candidates.length) return;
  const a = candidates[Math.floor(Math.random() * candidates.length)];
  const x = form.x + a.col * CELL_W + ALIEN_W / 2;
  const y = form.y + a.row * CELL_H + ALIEN_H;
  const aim = levelIdx >= 1 ? (ship.x + SHIP_W / 2 - x) / 90 : 0;
  eBullets.push({ x, y, vx: clamp(aim, -2.2, 2.2), vy: 4.2 + levelIdx * 0.45, r: 4 });
  beep(210, 0.05, 0.07, 'sawtooth');
}

function updateBoss() {
  if (!boss) return;
  if (boss.dying) {
    boss.deathTimer--;
    addShake(Math.min(20, 8 + (110 - boss.deathTimer) * 0.12));
    if (boss.deathTimer % 5 === 0 && boss.deathTimer > 15) {
      const rx = boss.x + Math.random() * boss.w;
      const ry = boss.y + Math.random() * boss.h;
      const cols = COLORS;
      spawnParticles(rx, ry, cols[Math.floor(Math.random() * cols.length)], 18, 1.8, 6);
      sweep(320 + Math.random() * 200, 80, 0.12, 0.18, 'sawtooth');
    }
    if (boss.deathTimer === 15) {
      const cx = boss.x + boss.w / 2, cy = boss.y + boss.h / 2;
      addRing(cx, cy, '#4cc2ff', 6);
      addRing(cx, cy, '#ffd23f', 4);
      COLORS.forEach(col => {
        spawnParticles(cx, cy, col, 34, 2.8, 7);
      });
      addShake(24);
      sweep(140, 30, 0.7, 0.4, 'sawtooth');
      fanfare();
    }
    if (boss.deathTimer <= 0) {
      saveHigh();
      saveMaxLevel();
      boss = null;
      state = 'won';
      submitScore();
      updateHud();
    }
    return;
  }

  const rage = 1 - boss.hp / boss.maxHp;
  boss.x += boss.dir * (1.2 + rage * 1.2);
  if (boss.x < 28) { boss.x = 28; boss.dir = 1; }
  if (boss.x + boss.w > W - 28) { boss.x = W - 28 - boss.w; boss.dir = -1; }
  boss.y = 80 + Math.sin(Date.now() / 700) * 8;
  if (boss.flash > 0) boss.flash -= 0.05;
  if (boss.invuln > 0) boss.invuln--;

  boss.fireT--;
  if (boss.fireT <= 0) {
    boss.fireT = boss.hp < boss.maxHp * 0.5 ? 68 : 100;
    const cx = boss.x + boss.w / 2;
    const cy = boss.y + boss.h - 8;
    const spread = boss.hp < boss.maxHp * 0.5 ? [-3, -1.5, 0, 1.5, 3] : [-2, 0, 2];
    for (const vx of spread) {
      eBullets.push({ x: cx - 4, y: cy, vx, vy: 4.4, r: 5 });
    }
    sweep(300, 120, 0.18, 0.12, 'square');
  }

  // Cápsulas de apoyo durante el combate
  boss.puT--;
  if (boss.puT <= 0) {
    boss.puT = 560;
    spawnCapsule(100 + Math.random() * (W - 200), -24, PU_TYPES[Math.floor(Math.random() * PU_TYPES.length)]);
  }
}

function updatePowerups() {
  for (const p of powerups) {
    p.y += p.vy;
    p.x = p.baseX + Math.sin(Date.now() / 320 + p.phase) * 16;
    if (rectsOverlap(p.x - 21, p.y - 11, 42, 22, ship.x + 4, ship.y + 2, SHIP_W - 8, SHIP_H - 4)) {
      applyPowerup(p.type);
      p.dead = true;
    }
    if (p.y > H + 30) p.dead = true;
  }
  powerups = powerups.filter(p => !p.dead);
}

// ---------- Actualización ----------
let fireCd = 0;

function updateParticles() {
  for (const p of particles) {
    if (p.ring) {
      p.r += p.vr;
      p.life -= p.decay;
      continue;
    }
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.035;
    p.vx *= 0.995;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

function levelCleared() {
  score += 250;
  saveHigh();
  saveMaxLevel();
  arpeggio();
  updateHud();
  if (levelIdx < LEVELS.length - 1) {
    state = 'transition';
    transition = { t: 0, next: levelIdx + 1 };
  } else {
    state = 'won';
    submitScore();
  }
}

function update() {
  if (paused) return;
  updateParticles();
  if (shake > 0) shake = Math.max(0, shake - 0.7);

  if (state === 'transition') {
    transition.t++;
    if (transition.t === 40) sweep(400, 900, 0.35, 0.14, 'triangle');
    if (transition.t >= 120) loadLevel(transition.next);
    return;
  }

  if (state === 'ready') {
    fireCd = 0;
    return;
  }

  if (state === 'gameover' || state === 'won') return;

  // --- Estado de juego ---
  for (const k in puTimers) {
    if (puTimers[k] > 0) {
      puTimers[k]--;
      if (puTimers[k] <= 0) {
        delete puTimers[k];
        updateHud();
      }
    }
  }
  if (ship.invuln > 0) ship.invuln--;

  if (aliens) {
    for (const a of aliens) {
      if (a.invuln > 0) a.invuln--;
      if (a.flash > 0) a.flash = Math.max(0, a.flash - 0.2);
    }
  }

  // Movimiento de la nave
  if (keys.left) ship.x -= ship.speed;
  if (keys.right) ship.x += ship.speed;
  ship.x = clamp(ship.x, 16, W - 16 - SHIP_W);

  // Estela del motor
  if (Math.random() < 0.85) {
    particles.push({
      x: ship.x + SHIP_W / 2 + (Math.random() * 10 - 5),
      y: ship.y + SHIP_H - 2,
      vx: (Math.random() * 0.8 - 0.4),
      vy: 1.6 + Math.random() * 1.6,
      life: 0.8,
      decay: 0.06,
      color: Math.random() < 0.4 ? '#ffd23f' : '#4cc2ff',
      size: 2 + Math.random() * 2,
    });
  }

  // Disparo (mantener pulsado)
  if (fireCd > 0) fireCd--;
  if (firing && fireCd <= 0) {
    shoot();
    fireCd = puTimers.rapid > 0 ? 7 : 13;
  }

  // Formación y disparos enemigos
  if (boss) {
    updateBoss();
  } else {
    updateFormation();
    if (state !== 'playing') return;
    updateAlienFire();
  }

  updatePlayerBullets();
  updateEnemyBullets();
  if (state !== 'playing') return;
  updatePowerups();

  // ¿Oleada completada?
  if (!boss && aliens.length && aliens.every(a => a.hp <= 0)) {
    levelCleared();
  }
}

// ---------- Dibujo ----------
const FONT = '"Courier New", monospace';

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawBackground(now) {
  ctx.fillStyle = '#05070d';
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(W / 2, 120, 20, W / 2, 120, 520);
  glow.addColorStop(0, 'rgba(46, 85, 160, 0.22)');
  glow.addColorStop(0.55, 'rgba(20, 32, 64, 0.10)');
  glow.addColorStop(1, 'rgba(5, 7, 13, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const tw = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(now / 700 + s.phase));
    ctx.globalAlpha = tw;
    ctx.fillStyle = s.r > 1.6 ? '#cfe8ff' : '#8fa6c4';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  const floor = ctx.createLinearGradient(0, H - 110, 0, H);
  floor.addColorStop(0, 'rgba(76, 194, 255, 0)');
  floor.addColorStop(1, 'rgba(76, 194, 255, 0.07)');
  ctx.fillStyle = floor;
  ctx.fillRect(0, H - 110, W, 110);
}

function drawTopUi() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';

  ctx.textAlign = 'center';
  ctx.font = 'bold 24px ' + FONT;
  ctx.fillStyle = '#f2f6ff';
  ctx.shadowColor = '#4cc2ff';
  ctx.shadowBlur = 12;
  ctx.fillText(String(Math.max(0, score | 0)).padStart(6, '0'), W / 2, 36);
  ctx.shadowBlur = 0;

  ctx.textAlign = 'left';
  ctx.font = 'bold 12px ' + FONT;
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('NIVEL ' + (levelIdx + 1), 22, 26);
  ctx.font = '10px ' + FONT;
  ctx.fillStyle = '#8b97ad';
  ctx.fillText(LEVELS[levelIdx].name.replace(/^NIVEL \d+ — /, ''), 22, 44);

  const count = boss ? Math.max(0, boss.hp) : aliveAliens().length;
  const bossLevel = !!LEVELS[levelIdx].boss;
  ctx.textAlign = 'right';
  ctx.font = 'bold 12px ' + FONT;
  ctx.fillStyle = '#4cc2ff';
  ctx.fillText((bossLevel ? 'JEFE ' : 'ENEMIGOS ') + (bossLevel && !boss ? '—' : count), W - 22, 26);
  ctx.font = '10px ' + FONT;
  ctx.fillStyle = '#8b97ad';
  ctx.fillText(boss ? 'DOH — NAVE MADRE' : 'INVASORES ACTIVOS', W - 22, 44);

  if (boss) {
    const bw = 280, bx = W / 2 - bw / 2, by = 50;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(bx, by, bw, 9, 4);
    ctx.fill();
    const ratio = Math.max(0, boss.hp / boss.maxHp);
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, '#ff2e63');
    grad.addColorStop(0.55, '#ffd23f');
    grad.addColorStop(1, '#4cc2ff');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#ff2e63';
    ctx.shadowBlur = 10;
    roundRect(bx, by, Math.max(0.01, bw * ratio), 9, 4);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.font = '9px ' + FONT;
    ctx.fillStyle = '#8b97ad';
    ctx.textAlign = 'right';
    ctx.fillText('INTEGRIDAD', bx - 8, by + 8);
    ctx.textAlign = 'left';
    ctx.fillText(Math.max(0, boss.hp) + '/' + boss.maxHp, bx + bw + 8, by + 8);
  }
  ctx.restore();
}

function drawInvasionLine() {
  let near = false;
  if (form) {
    const b = formationBounds();
    near = isFinite(b.maxY) && b.maxY > INVASION_Y - 90;
  }
  ctx.save();
  ctx.strokeStyle = near ? 'rgba(255,46,99,0.45)' : 'rgba(255,46,99,0.12)';
  ctx.lineWidth = 1;
  ctx.setLineDash([9, 9]);
  ctx.beginPath();
  ctx.moveTo(0, INVASION_Y);
  ctx.lineTo(W, INVASION_Y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawShields() {
  ctx.save();
  ctx.shadowColor = '#3ddc97';
  ctx.shadowBlur = 6;
  for (const sh of shields) {
    if (sh.hp <= 0) continue;
    ctx.fillStyle = '#3ddc97';
    ctx.fillRect(sh.x, sh.y, sh.w, sh.h);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(sh.x + 1, sh.y + 1, sh.w - 2, 2);
  }
  ctx.restore();
}

function drawAlien(a) {
  const r = alienRect(a);
  const sprite = SPRITES[a.type];
  const color = a.flash > 0.2 ? '#ffffff' : ALIEN_COLOR[a.type];
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 7;
  ctx.fillStyle = color;
  const cw = 3, ch = 3;
  const ox = Math.round(r.x + (ALIEN_W - 11 * cw) / 2);
  const oy = Math.round(r.y + (ALIEN_H - 8 * ch) / 2 + (form.anim ? 1 : 0));
  for (let ry = 0; ry < 8; ry++) {
    const row = sprite[ry];
    const jitter = form.anim && ry >= 6 ? 1 : 0;
    for (let cx = 0; cx < 11; cx++) {
      if (row[cx] === '1') ctx.fillRect(ox + cx * cw + jitter, oy + ry * ch, cw - 0.4, ch - 0.4);
    }
  }
  if (a.maxHp > 1) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (let i = 0; i < a.hp; i++) ctx.fillRect(r.x + 4 + i * 7, r.y - 5, 5, 2);
  }
  ctx.restore();
}

function drawBoss(now) {
  if (!boss) return;
  const { x, y, w, h } = boss;
  const cx = x + w / 2;
  const cy = y + h / 2;

  ctx.save();
  if (boss.dying) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(now / 90));
  }

  // Resplandor
  const halo = ctx.createRadialGradient(cx, cy, 10, cx, cy, w * 0.75);
  halo.addColorStop(0, 'rgba(255,46,99,0.30)');
  halo.addColorStop(1, 'rgba(255,46,99,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(cx - w, cy - h, w * 2, h * 2);

  // Casco inferior (platillo)
  const hull = ctx.createLinearGradient(x, y, x, y + h);
  hull.addColorStop(0, boss.flash > 0.3 ? '#ffd7e1' : '#5a2350');
  hull.addColorStop(0.55, boss.flash > 0.3 ? '#ff6b8a' : '#331535');
  hull.addColorStop(1, '#140a1c');
  ctx.fillStyle = hull;
  ctx.strokeStyle = boss.flash > 0.3 ? '#ffffff' : '#ff2e63';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#ff2e63';
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.ellipse(cx, cy + 16, w / 2, h / 2 - 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Cúpula
  const dome = ctx.createLinearGradient(cx, y - 10, cx, y + 46);
  dome.addColorStop(0, boss.flash > 0.3 ? '#ffffff' : '#2ec5ff');
  dome.addColorStop(1, '#0b2a4a');
  ctx.fillStyle = dome;
  ctx.beginPath();
  ctx.ellipse(cx, y + 28, 70, 34, 0, Math.PI, 0);
  ctx.lineTo(cx + 70, y + 30);
  ctx.ellipse(cx, y + 28, 70, 8, 0, 0, Math.PI);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(76,194,255,0.85)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Núcleo
  const rage = 1 - boss.hp / boss.maxHp;
  const pulse = 15 + Math.sin(now / 160) * 3 + rage * 4;
  const coreColor = rage > 0.66 ? '#ff2e63' : (rage > 0.33 ? '#ffd23f' : '#4cc2ff');
  ctx.shadowColor = coreColor;
  ctx.shadowBlur = 26;
  ctx.fillStyle = coreColor;
  ctx.beginPath();
  ctx.arc(cx, y + 46, pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx, y + 46, pulse * 0.42, 0, Math.PI * 2);
  ctx.fill();

  // Luces del borde
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#ffd23f';
  for (let i = 0; i < 9; i++) {
    const angle = Math.PI * (0.12 + 0.76 * (i / 8));
    const lx = cx - Math.cos(angle) * (w / 2 - 10);
    const ly = cy + 16 + Math.sin(angle) * (h / 2 - 14);
    ctx.beginPath();
    ctx.arc(lx, ly, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Cañones
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#ff6b35';
  for (const dx of [-64, 0, 64]) {
    roundRect(cx + dx - 8, y + h - 14, 16, 16, 4);
    ctx.fill();
  }
  ctx.restore();
}

function drawPowerups() {
  for (const p of powerups) {
    const c = PU_COLOR[p.type];
    const pulse = 0.75 + 0.25 * Math.sin(performance.now() / 180 + p.phase);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.shadowColor = c;
    ctx.shadowBlur = 14 * pulse;
    ctx.fillStyle = '#0b1220';
    roundRect(-21, -11, 42, 22, 7);
    ctx.fill();
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = c;
    ctx.font = 'bold 15px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(PU_ICON[p.type], 0, 1);
    ctx.restore();
  }
}

function drawBullets() {
  ctx.save();
  for (const b of pBullets) {
    if (b.pierce) {
      ctx.shadowColor = '#ff2e63';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#ff2e63';
      ctx.fillRect(b.x - 2, b.y - 16, 6, 20);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(b.x - 0.5, b.y - 15, 3, 18);
    } else {
      ctx.shadowColor = '#4cc2ff';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#bff2ff';
      ctx.fillRect(b.x - 1.5, b.y - 10, 4, 14);
    }
  }
  for (const b of eBullets) {
    ctx.shadowColor = '#ff2e63';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff2e63';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r || 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffd7e1';
    ctx.beginPath();
    ctx.arc(b.x - 1, b.y - 1, (b.r || 4) * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  for (const p of particles) {
    if (p.ring) {
      ctx.globalAlpha = Math.max(0, p.life) * 0.7;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.lineWidth;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.stroke();
      continue;
    }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawShip(now) {
  const cx = ship.x + SHIP_W / 2;
  const cy = ship.y + SHIP_H / 2;
  ctx.save();
  if (ship.invuln > 0 && Math.floor(ship.invuln / 4) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.translate(cx, cy);
  ctx.shadowColor = '#4cc2ff';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#4cc2ff';
  ctx.beginPath();
  ctx.moveTo(0, -16);
  ctx.lineTo(7, -2);
  ctx.lineTo(20, 8);
  ctx.lineTo(10, 8);
  ctx.lineTo(7, 14);
  ctx.lineTo(-7, 14);
  ctx.lineTo(-10, 8);
  ctx.lineTo(-20, 8);
  ctx.lineTo(-7, -2);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0b1220';
  ctx.beginPath();
  ctx.moveTo(0, -9);
  ctx.lineTo(5, 0);
  ctx.lineTo(4, 10);
  ctx.lineTo(-4, 10);
  ctx.lineTo(-5, 0);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#ffd23f';
  ctx.shadowColor = '#ffd23f';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(0, -1, 3.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  const flame = 3 + Math.random() * 5;
  ctx.fillStyle = 'rgba(255,107,53,0.9)';
  ctx.fillRect(-4, 14, 8, flame);
  ctx.fillStyle = 'rgba(255,210,63,0.9)';
  ctx.fillRect(-2, 14, 4, flame * 0.6);
  ctx.restore();

  if (puTimers.shield > 0) {
    const a = 0.35 + 0.25 * Math.sin(now / 180);
    ctx.save();
    ctx.strokeStyle = 'rgba(61,220,151,' + a.toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#3ddc97';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(cx, cy, 33, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = 'rgba(61,220,151,0.10)';
    ctx.fill();
    ctx.restore();
  }
}

function drawTimers() {
  const order = ['triple', 'laser', 'shield', 'rapid'];
  let i = 0;
  for (const k of order) {
    if (!puTimers[k]) continue;
    const ratio = clamp(puTimers[k] / (k === 'shield' ? 720 : 600), 0, 1);
    const x = 20 + i * 78;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRect(x, H - 16, 66, 4, 2);
    ctx.fill();
    ctx.fillStyle = PU_COLOR[k];
    ctx.shadowColor = PU_COLOR[k];
    ctx.shadowBlur = 8;
    roundRect(x, H - 16, 66 * ratio, 4, 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    i++;
  }
}

function drawStateOverlay(now) {
  const pulse = 0.6 + 0.4 * Math.sin(now / 380);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (paused && (state === 'playing' || state === 'ready')) {
    ctx.fillStyle = 'rgba(5,7,13,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 34px ' + FONT;
    ctx.fillStyle = '#4cc2ff';
    ctx.shadowColor = '#4cc2ff';
    ctx.shadowBlur = 24;
    ctx.fillText('PAUSA', W / 2, H / 2 - 16);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = pulse;
    ctx.font = '13px ' + FONT;
    ctx.fillStyle = '#c9d3e6';
    ctx.fillText('PULSA P O ESC PARA CONTINUAR', W / 2, H / 2 + 32);
    ctx.globalAlpha = 1;
  } else if (state === 'ready') {
    ctx.fillStyle = 'rgba(5,7,13,0.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 34px ' + FONT;
    ctx.fillStyle = '#4cc2ff';
    ctx.shadowColor = '#4cc2ff';
    ctx.shadowBlur = 26;
    ctx.fillText('NIVEL ' + (levelIdx + 1), W / 2, H / 2 - 74);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 14px ' + FONT;
    ctx.fillStyle = '#c9d3e6';
    ctx.fillText(LEVELS[levelIdx].name.replace(/^NIVEL \d+ — /, ''), W / 2, H / 2 - 42);
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 15px ' + FONT;
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('PULSA ESPACIO O TOCA PARA DESPEGAR', W / 2, H / 2 + 6);
    ctx.globalAlpha = 1;
    ctx.font = '12px ' + FONT;
    ctx.fillStyle = '#8b97ad';
    ctx.fillText('← → / A D para moverte · mantén pulsado para disparar', W / 2, H / 2 + 40);
  } else if (state === 'paused') {
    ctx.fillStyle = 'rgba(5,7,13,0.70)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 34px ' + FONT;
    ctx.fillStyle = '#4cc2ff';
    ctx.shadowColor = '#4cc2ff';
    ctx.shadowBlur = 24;
    ctx.fillText('PAUSA', W / 2, H / 2 - 14);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = pulse;
    ctx.font = '13px ' + FONT;
    ctx.fillStyle = '#c9d3e6';
    ctx.fillText('PULSA P O ESC PARA CONTINUAR', W / 2, H / 2 + 34);
  } else if (state === 'transition') {
    ctx.fillStyle = 'rgba(5,7,13,0.66)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 32px ' + FONT;
    ctx.fillStyle = '#3ddc97';
    ctx.shadowColor = '#3ddc97';
    ctx.shadowBlur = 24;
    ctx.fillText('OLEADA SUPERADA', W / 2, H / 2 - 60);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 15px ' + FONT;
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('+250 PUNTOS', W / 2, H / 2 - 20);
    if (transition && transition.t > 40) {
      ctx.globalAlpha = pulse;
      ctx.font = '13px ' + FONT;
      ctx.fillStyle = '#c9d3e6';
      ctx.fillText('SIGUIENTE: ' + LEVELS[transition.next].name, W / 2, H / 2 + 26);
      ctx.globalAlpha = 1;
    }
  } else if (state === 'gameover') {
    ctx.fillStyle = 'rgba(5,7,13,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 38px ' + FONT;
    ctx.fillStyle = '#ff2e63';
    ctx.shadowColor = '#ff2e63';
    ctx.shadowBlur = 28;
    ctx.fillText('GAME OVER', W / 2, H / 2 - 74);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 16px ' + FONT;
    ctx.fillStyle = '#e8ecf5';
    ctx.fillText('PUNTOS: ' + score, W / 2, H / 2 - 26);
    ctx.font = '12px ' + FONT;
    ctx.fillStyle = '#8b97ad';
    ctx.fillText('RÉCORD: ' + Math.max(highScore, score), W / 2, H / 2 + 2);
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 14px ' + FONT;
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('C O TOCA PARA REINTENTAR EL NIVEL', W / 2, H / 2 + 48);
    ctx.globalAlpha = 1;
    ctx.font = '11px ' + FONT;
    ctx.fillStyle = '#8b97ad';
    ctx.fillText('R PARA EMPEZAR DE NUEVO', W / 2, H / 2 + 74);
  } else if (state === 'won') {
    ctx.fillStyle = 'rgba(5,7,13,0.84)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 40px ' + FONT;
    ctx.fillStyle = '#ffd23f';
    ctx.shadowColor = '#ffd23f';
    ctx.shadowBlur = 30;
    ctx.fillText('¡VICTORIA!', W / 2, H / 2 - 78);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 15px ' + FONT;
    ctx.fillStyle = '#3ddc97';
    ctx.fillText('HAS DESTRUIDO LA NAVE MADRE', W / 2, H / 2 - 34);
    ctx.font = 'bold 16px ' + FONT;
    ctx.fillStyle = '#e8ecf5';
    ctx.fillText('PUNTOS: ' + score, W / 2, H / 2 + 2);
    ctx.font = '12px ' + FONT;
    ctx.fillStyle = '#8b97ad';
    ctx.fillText('RÉCORD: ' + Math.max(highScore, score), W / 2, H / 2 + 26);
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 14px ' + FONT;
    ctx.fillStyle = '#4cc2ff';
    ctx.fillText('R O TOCA PARA JUGAR DE NUEVO', W / 2, H / 2 + 66);
  }
  ctx.restore();
}

function draw(now) {
  const t = now || performance.now();
  ctx.save();
  if (shake > 0.4) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawBackground(t);
  drawTopUi();
  if (form) drawInvasionLine();
  drawShields();
  if (aliens) {
    for (const a of aliens) if (a.hp > 0) drawAlien(a);
  }
  drawBoss(t);
  drawPowerups();
  drawBullets();
  drawParticles();
  drawShip(t);
  drawTimers();
  ctx.restore();
  drawStateOverlay(t);
}

// ---------- Bucle con paso de tiempo fijo (60 Hz) ----------
let lastTime = 0;
let accumulator = 0;
const FIXED_STEP = 1000 / 60;

function loop(ts) {
  if (!lastTime) lastTime = ts || performance.now();
  const now = ts || performance.now();
  let dt = now - lastTime;
  if (dt > 200) dt = 200;
  lastTime = now;
  accumulator += dt;
  let guard = 0;
  while (accumulator >= FIXED_STEP && guard < 8) {
    update();
    accumulator -= FIXED_STEP;
    guard++;
  }
  draw(now);
  requestAnimationFrame(loop);
}

// ---------- Entrada ----------
function moveShipToClientX(clientX) {
  const rect = canvas.getBoundingClientRect();
  if (!rect.width) return;
  const x = (clientX - rect.left) * (W / rect.width);
  ship.x = clamp(x - SHIP_W / 2, 16, W - 16 - SHIP_W);
}

function pointerAction() {
  if (state === 'ready') startWave();
  else if (state === 'gameover') { paused = false; continueLevel(); }
  else if (state === 'won') { paused = false; resetGame(); }
}

window.addEventListener('keydown', (e) => {
  resumeAudio();
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
    keys.left = true;
    e.preventDefault();
  } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
    keys.right = true;
    e.preventDefault();
  } else if (e.code === 'Space' || k === ' ') {
    if (state === 'ready') startWave();
    firing = true;
    e.preventDefault();
  } else if (k === 'p' || k === 'P' || k === 'Escape') {
    if (state === 'playing' || state === 'ready') paused = !paused;
  } else if (k === 'c' || k === 'C') {
    if (state === 'gameover') { paused = false; continueLevel(); }
  } else if (k === 'r' || k === 'R') {
    paused = false;
    resetGame();
  }
});

window.addEventListener('keyup', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (e.code === 'Space' || k === ' ') firing = mouseDown || touching;
});

canvas.addEventListener('mousemove', (e) => {
  if (state === 'playing' || state === 'ready') moveShipToClientX(e.clientX);
});

canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  resumeAudio();
  pointerAction();
  mouseDown = true;
  firing = true;
  if (state === 'playing') moveShipToClientX(e.clientX);
});

window.addEventListener('mouseup', () => {
  mouseDown = false;
  if (!touching) firing = false;
});

function handleTouch(e) {
  const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
  if (t) moveShipToClientX(t.clientX);
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  resumeAudio();
  touching = true;
  pointerAction();
  handleTouch(e);
  firing = true;
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (touching) handleTouch(e);
}, { passive: false });

window.addEventListener('touchend', (e) => {
  if (!e.touches || e.touches.length === 0) {
    touching = false;
    if (!mouseDown) firing = false;
  }
});
window.addEventListener('touchcancel', () => {
  touching = false;
  if (!mouseDown) firing = false;
});

window.addEventListener('blur', () => {
  keys.left = false;
  keys.right = false;
  mouseDown = false;
  touching = false;
  firing = false;
});

document.getElementById('btnRestart').addEventListener('click', () => {
  resumeAudio();
  paused = false;
  firing = false;
  if (state === 'won') resetGame();
  else continueLevel();
});

// ---------- Inicio ----------
resetGame();
requestAnimationFrame(loop);

})();
</script>
