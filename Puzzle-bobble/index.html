<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Puzzle Bobble — Arcade</title>
<style>
  :root { --neon:#a78bfa; --bg:#0b0f1a; }
  * { box-sizing:border-box; margin:0; padding:0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #1b1636 0%, #0b0f1a 62%);
    font-family: 'Courier New', ui-monospace, monospace;
    color: #e8ecf5;
    padding: 6px;
  }

  .cabina {
    width: 100%;
    max-width: 864px;
    max-height: 100vh;
    max-height: 100dvh;
    padding: 12px 16px 10px;
    border: 2px solid rgba(167,139,250,.35);
    border-radius: 14px;
    background: #0d1220;
    box-shadow: 0 0 40px rgba(167,139,250,.15), inset 0 0 60px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  h1 {
    font-size: clamp(15px, 3vw, 21px);
    letter-spacing: clamp(2px, 0.8vw, 5px);
    color: var(--neon);
    text-shadow: 0 0 12px rgba(167,139,250,.6);
    margin-bottom: 8px;
    text-align: center;
    white-space: nowrap;
  }

  .canvas-wrapper {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 auto;
    min-height: 0;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    max-width: 800px;
    max-height: calc(100dvh - 120px);
    aspect-ratio: 800 / 600;
    object-fit: contain;
    border-radius: 10px;
    background: #05070d;
    touch-action: none;
    cursor: crosshair;
  }

  canvas:focus {
    outline: none;
  }

  .hud {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 6px 12px;
    margin-top: 8px;
    font-size: clamp(11px, 2.2vw, 14px);
    letter-spacing: 1px;
  }

  .hud b { color: var(--neon); }
  .vidas { color: #ff2e63; letter-spacing: 3px; text-shadow: 0 0 8px rgba(255,46,99,.5); }
  .record { color: #ffd23f; }
  .powerups {
    margin-top: 4px;
    font-size: clamp(10px, 2vw, 12px);
    letter-spacing: 1px;
    color: #3ddc97;
    min-height: 16px;
    text-align: center;
    width: 100%;
  }

  .controls {
    margin-top: 6px;
    font-size: clamp(9px, 1.8vw, 11px);
    color: #8b97ad;
    text-align: center;
    line-height: 1.3;
    width: 100%;
  }

  button {
    background: transparent;
    border: 1px solid var(--neon);
    color: var(--neon);
    font-family: inherit;
    font-size: clamp(10px, 2vw, 12px);
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    touch-action: manipulation;
  }

  button:hover { background: rgba(167,139,250,.12); }
  button.destacado {
    border-color: #ffd23f;
    color: #ffd23f;
    text-shadow: 0 0 10px rgba(255,210,63,.6);
    background: rgba(255,210,63,.10);
  }

  @media (max-height: 540px) {
    body { padding: 2px; }
    .cabina {
      padding: 4px 8px;
      border-width: 1px;
      border-radius: 8px;
    }
    h1 {
      font-size: 12px;
      letter-spacing: 1.5px;
      margin-bottom: 2px;
    }
    canvas {
      max-height: calc(100dvh - 64px);
    }
    .hud {
      margin-top: 2px;
      gap: 3px 6px;
      font-size: 10px;
      letter-spacing: 0.5px;
    }
    .powerups {
      margin-top: 1px;
      min-height: 12px;
      font-size: 9px;
    }
    .controls { display: none; }
    button { padding: 2px 6px; font-size: 9px; }
  }
</style>
</head>
<body>
<div class="cabina">
  <h1>PUZZLE BOBBLE</h1>
  <div class="canvas-wrapper">
    <canvas id="game" width="800" height="600" tabindex="0" aria-label="Área de juego de Puzzle Bobble"></canvas>
  </div>
  <div class="hud">
    <div>PUNTOS: <b id="score">0</b></div>
    <div>RÉCORD: <b class="record" id="highscore">0</b></div>
    <div>NIVEL MÁX: <b class="record" id="maxlevel">1</b></div>
    <div><span id="objLabel">BURBUJAS</span>: <b id="bubbles">0</b></div>
    <div class="vidas" id="lives">♥♥♥</div>
    <div>NIVEL: <b id="level">1</b></div>
    <button id="btnRestart">REINICIAR NIVEL</button>
  </div>
  <div class="powerups" id="powerups"></div>
  <div class="controls">← / → o ratón: apuntar · ESPACIO / clic / toque: disparar · P o ESC: pausa · C: continuar · R: reiniciar</div>
</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const elScore = document.getElementById('score');
const elHigh = document.getElementById('highscore');
const elMax = document.getElementById('maxlevel');
const elBubbles = document.getElementById('bubbles');
const elObjLabel = document.getElementById('objLabel');
const elLives = document.getElementById('lives');
const elLevel = document.getElementById('level');
const elPower = document.getElementById('powerups');
const btnRestart = document.getElementById('btnRestart');

// ---------- Audio procedural ----------
let audioCtx = null;
function resumeAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function beep(freq, dur = 0.06, vol = 0.12, type = 'square') {
  try {
    resumeAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function sweep(f0, f1, dur, vol = 0.15, type = 'sawtooth') {
  try {
    resumeAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f1, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function noise(dur = 0.25, vol = 0.18) {
  try {
    resumeAudio();
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1100;
    const g = audioCtx.createGain();
    g.gain.value = vol;
    src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
    src.start();
  } catch (e) {}
}
function arpeggio() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.14, 0.12, 'triangle'), i * 70));
}
function fanfare() {
  [523, 659, 784, 1047, 1319, 1047, 784, 1047, 1319, 1568, 1047]
    .forEach((f, i) => setTimeout(() => beep(f, 0.28, 0.14, 'triangle'), i * 130));
}
const PU_SOUND = {
  bomb:    () => { noise(0.3, 0.2); sweep(120, 50, 0.3, 0.2); },
  rainbow: () => { [659, 784, 988, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.12, 0.1, 'sine'), i * 55)); },
  guide:   () => { sweep(600, 1400, 0.25, 0.1, 'sine'); },
  freeze:  () => { sweep(900, 220, 0.45, 0.14, 'sine'); beep(1500, 0.1, 0.06, 'triangle'); },
};
function shootSound() { sweep(700, 300, 0.08, 0.08, 'square'); }
function stickSound() { beep(520, 0.05, 0.07, 'triangle'); }
function popSound(n) {
  const base = 480 + Math.min(10, n) * 55;
  beep(base, 0.07, 0.1, 'triangle');
  setTimeout(() => beep(base * 1.35, 0.06, 0.08, 'triangle'), 35);
}
function dropSound() { noise(0.32, 0.13); sweep(400, 120, 0.3, 0.1, 'triangle'); }

// ---------- Constantes ----------
const R = 18;                          // radio de burbuja
const D = R * 2;                       // diámetro
const ROW_H = Math.sqrt(3) * R;        // alto hexagonal
const COLS = 22;                       // celdas en filas pares
const GRID_X = 4;                      // margen del tablero
const GRID_TOP = 74;                   // centro de la fila 0
const DANGER_Y = 500;                  // línea de peligro
const SHOOTER_X = W / 2;
const SHOOTER_Y = H - 44;              // 556
const SHOT_SPEED = 13;
const MAX_ROWS = 40;
const MIN_ANGLE = -Math.PI + 0.30;
const MAX_ANGLE = -0.30;

const BUBBLE_COLORS = ['#ff2e63', '#ff9f1c', '#ffd23f', '#3ddc97', '#4cc2ff', '#a78bfa'];
const STONE_COLOR = '#7d8aa3';
const PU_TYPES = ['bomb', 'rainbow', 'guide', 'freeze'];
const PU_LABEL = { bomb: 'BOMBA', rainbow: 'ARCOÍRIS', guide: 'GUÍA LÁSER', freeze: 'TECHO CONGELADO' };
const PU_COLOR = { bomb: '#ff9f1c', rainbow: '#ffd23f', guide: '#4cc2ff', freeze: '#a8f0ff' };
const PU_ICON = { bomb: 'B', rainbow: 'A', guide: 'G', freeze: 'C' };

// ---------- Utilidades ----------
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function pad(n, len) { return String(n).padStart(len, '0'); }
function shade(hex, amt) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  if (amt >= 0) {
    r = Math.round(r + (255 - r) * amt);
    g = Math.round(g + (255 - g) * amt);
    b = Math.round(b + (255 - b) * amt);
  } else {
    const k = 1 + amt;
    r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
  }
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Niveles ----------
const LEVELS = [
  {
    name: 'NIVEL 1 — PRIMER BURBUJEO',
    pattern: 'bands', rows: 4, palette: [0, 1, 3, 4],
    dropEvery: 8, gridTop: GRID_TOP, powerups: 4,
  },
  {
    name: 'NIVEL 2 — ESPIRAL',
    pattern: 'spiral', rows: 5, palette: [0, 2, 3, 4, 5],
    dropEvery: 7, gridTop: GRID_TOP, powerups: 5,
  },
  {
    name: 'NIVEL 3 — FORTALEZA',
    pattern: 'fortress', rows: 5, palette: [0, 1, 2, 3, 4, 5],
    dropEvery: 6, gridTop: GRID_TOP, powerups: 6,
  },
  {
    name: 'NIVEL 4 — DOH, LA BURBUJA MADRE',
    pattern: 'boss', rows: 5, palette: [0, 2, 3, 4, 5],
    dropEvery: 6, gridTop: 170, powerups: 4, boss: true,
  },
];

// ---------- Estado ----------
let state;                 // ready | playing | paused | transition | gameover | won
let grid;                  // filas: { parity, cells: [] }
let levelIdx, score, lives, shotsUntilDrop, refillT, transitionT;
let angle, currentBubble, nextBubble, shot;
let particles, floats, shake, paused;
let boss, scoreSubmitted, t, lastTime, acc;
let puTimers = { rainbow: 0, guide: 0, freeze: 0 };
let puShots = { bomb: false };
let highScore = parseInt(localStorage.getItem('pb_high') || '0', 10);
let maxLevel = parseInt(localStorage.getItem('pb_maxlevel') || '1', 10);
const keys = { left: false, right: false };
let stars = [], drifters = [];

// ---------- Sprites pre-renderizados ----------
const SPR_PAD = 5, SPR_SIZE = D + SPR_PAD * 2, SPR_C = SPR_SIZE / 2;
const spriteCache = {};

function makeBubbleSprite(color) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = SPR_SIZE;
  const c = cv.getContext('2d');
  const halo = c.createRadialGradient(SPR_C, SPR_C, R * 0.6, SPR_C, SPR_C, SPR_C);
  halo.addColorStop(0, 'rgba(0,0,0,0)');
  halo.addColorStop(0.72, 'rgba(0,0,0,0)');
  halo.addColorStop(1, color + '55');
  c.fillStyle = halo;
  c.beginPath(); c.arc(SPR_C, SPR_C, SPR_C, 0, Math.PI * 2); c.fill();

  const g = c.createRadialGradient(SPR_C - R * 0.35, SPR_C - R * 0.4, 2, SPR_C, SPR_C, R);
  g.addColorStop(0, shade(color, 0.9));
  g.addColorStop(0.36, color);
  g.addColorStop(0.74, shade(color, -0.16));
  g.addColorStop(1, shade(color, -0.6));
  c.fillStyle = g;
  c.beginPath(); c.arc(SPR_C, SPR_C, R - 0.5, 0, Math.PI * 2); c.fill();
  c.lineWidth = 1.5;
  c.strokeStyle = shade(color, -0.35);
  c.stroke();

  c.beginPath();
  c.ellipse(SPR_C - R * 0.34, SPR_C - R * 0.4, R * 0.3, R * 0.2, -0.6, 0, Math.PI * 2);
  c.fillStyle = 'rgba(255,255,255,.72)';
  c.fill();
  return cv;
}

function makeWildSprite() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = SPR_SIZE;
  const c = cv.getContext('2d');
  const g = c.createLinearGradient(SPR_C - R, SPR_C - R, SPR_C + R, SPR_C + R);
  BUBBLE_COLORS.forEach((col, i) => g.addColorStop(i / (BUBBLE_COLORS.length - 1), col));
  c.fillStyle = g;
  c.beginPath(); c.arc(SPR_C, SPR_C, R - 0.5, 0, Math.PI * 2); c.fill();
  c.lineWidth = 2;
  c.strokeStyle = 'rgba(255,255,255,.9)';
  c.stroke();
  const gl = c.createRadialGradient(SPR_C, SPR_C, 2, SPR_C, SPR_C, R);
  gl.addColorStop(0, 'rgba(255,255,255,.55)');
  gl.addColorStop(0.45, 'rgba(255,255,255,.06)');
  gl.addColorStop(1, 'rgba(0,0,0,.28)');
  c.fillStyle = gl;
  c.beginPath(); c.arc(SPR_C, SPR_C, R - 1, 0, Math.PI * 2); c.fill();
  return cv;
}

function makeStoneSprite() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = SPR_SIZE;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(SPR_C - 6, SPR_C - 7, 2, SPR_C, SPR_C, R);
  g.addColorStop(0, '#c3ccda');
  g.addColorStop(0.5, STONE_COLOR);
  g.addColorStop(1, '#394355');
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(SPR_C - R + 2, SPR_C - 4);
  c.lineTo(SPR_C - 9, SPR_C - R + 3);
  c.lineTo(SPR_C + 7, SPR_C - R + 1);
  c.lineTo(SPR_C + R - 2, SPR_C - 6);
  c.lineTo(SPR_C + R - 4, SPR_C + 9);
  c.lineTo(SPR_C + 3, SPR_C + R - 2);
  c.lineTo(SPR_C - 11, SPR_C + R - 4);
  c.closePath();
  c.fill();
  c.strokeStyle = '#2b3242';
  c.lineWidth = 1.5;
  c.stroke();
  c.fillStyle = 'rgba(30,38,52,.7)';
  c.beginPath(); c.arc(SPR_C - 6, SPR_C + 2, 2.2, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(SPR_C + 8, SPR_C - 5, 1.8, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.35)';
  c.beginPath(); c.moveTo(SPR_C - 8, SPR_C - 9); c.lineTo(SPR_C + 3, SPR_C - 7); c.stroke();
  return cv;
}

function makeBombSprite() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = SPR_SIZE;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(SPR_C - 5, SPR_C - 6, 2, SPR_C, SPR_C, R);
  g.addColorStop(0, '#5b6678');
  g.addColorStop(0.55, '#1b2230');
  g.addColorStop(1, '#05070d');
  c.fillStyle = g;
  c.beginPath(); c.arc(SPR_C, SPR_C + 1, R - 1, 0, Math.PI * 2); c.fill();
  c.lineWidth = 2;
  c.strokeStyle = '#ff9f1c';
  c.stroke();
  c.strokeStyle = '#ffd23f';
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(SPR_C + 6, SPR_C - R + 3);
  c.quadraticCurveTo(SPR_C + 13, SPR_C - R - 2, SPR_C + 10, SPR_C - R + 2);
  c.stroke();
  c.fillStyle = '#ffffff';
  c.beginPath(); c.arc(SPR_C - 5, SPR_C - 4, 2.4, 0, Math.PI * 2); c.fill();
  return cv;
}

function buildSprites() {
  BUBBLE_COLORS.forEach((col, i) => { spriteCache[i] = makeBubbleSprite(col); });
  spriteCache.wild = makeWildSprite();
  spriteCache.stone = makeStoneSprite();
  spriteCache.bomb = makeBombSprite();
}

// ---------- Fondo decorativo ----------
function initBackground() {
  const rnd = mulberry32(20261025);
  stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({ x: rnd() * W, y: rnd() * H, r: 0.4 + rnd() * 1.4, a: 0.15 + rnd() * 0.55, sp: 0.1 + rnd() * 0.35 });
  }
  drifters = [];
  for (let i = 0; i < 12; i++) {
    drifters.push({
      x: rnd() * W, y: rnd() * H,
      r: 12 + rnd() * 34,
      vx: (rnd() - 0.5) * 0.12,
      vy: -0.08 - rnd() * 0.18,
      col: BUBBLE_COLORS[Math.floor(rnd() * BUBBLE_COLORS.length)],
      a: 0.04 + rnd() * 0.05,
      ph: rnd() * Math.PI * 2,
    });
  }
}

// ---------- HUD ----------
function updateHud() {
  elScore.textContent = pad(score, 5);
  elHigh.textContent = pad(highScore, 5);
  elMax.textContent = maxLevel;
  elLevel.textContent = levelIdx + 1;
  elLives.textContent = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives));
  if (boss) {
    elObjLabel.textContent = 'JEFE';
    elBubbles.textContent = Math.max(0, Math.ceil(boss.hp)) + '/' + boss.maxHp;
  } else {
    elObjLabel.textContent = 'BURBUJAS';
    elBubbles.textContent = countBubbles();
  }
  const parts = [];
  if (puTimers.guide > 0) parts.push('GUÍA ' + Math.ceil(puTimers.guide / 60) + 's');
  if (puTimers.freeze > 0) parts.push('CONGELADO ' + Math.ceil(puTimers.freeze / 60) + 's');
  if (puTimers.rainbow > 0) parts.push('ARCOÍRIS ' + Math.ceil(puTimers.rainbow / 60) + 's');
  if (puShots.bomb) parts.push('BOMBA LISTA');
  elPower.textContent = parts.join('  ·  ');
}

function saveHigh() {
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('pb_high', String(highScore)); } catch (e) {}
  }
}
function saveMaxLevel() {
  const reached = levelIdx + 1;
  if (reached > maxLevel) {
    maxLevel = reached;
    try { localStorage.setItem('pb_maxlevel', String(maxLevel)); } catch (e) {}
  }
}
function submitScore() {
  if (scoreSubmitted) return;
  scoreSubmitted = true;
  saveHigh();
  saveMaxLevel();
  try {
    window.parent.postMessage({
      type: 'PUZZLE_BOBBLE_SCORE_SUBMISSION',
      game: 'puzzle-bobble',
      score: score,
      level: levelIdx + 1,
      highScore: highScore,
    }, '*');
  } catch (e) {}
}

// ---------- Tablero hexagonal ----------
let gridTop = GRID_TOP;

function rowCols(parity) { return parity === 0 ? COLS : COLS - 1; }
function cellX(parity, c) { return GRID_X + R + c * D + parity * R; }
function cellY(r) { return gridTop + r * ROW_H; }
function blankRow(parity) { return { parity: parity, cells: new Array(rowCols(parity)).fill(null) }; }

function ensureRows(n) {
  while (grid.length < n) {
    const p = grid.length ? 1 - grid[grid.length - 1].parity : 0;
    grid.push(blankRow(p));
  }
}

function trimEmptyRows() {
  while (grid.length > 1) {
    const last = grid[grid.length - 1];
    let any = false;
    for (let c = 0; c < last.cells.length; c++) {
      if (last.cells[c]) { any = true; break; }
    }
    if (any) break;
    grid.pop();
  }
}

function forEachBubble(fn) {
  for (let r = 0; r < grid.length; r++) {
    const row = grid[r];
    if (!row) continue;
    for (let c = 0; c < row.cells.length; c++) {
      const cell = row.cells[c];
      if (cell) fn(cell, r, c, cellX(row.parity, c), cellY(r));
    }
  }
}

function countBubbles() {
  let n = 0;
  forEachBubble(() => { n++; });
  return n;
}

function rowHasAny(r) {
  const row = grid[r];
  if (!row) return false;
  for (let c = 0; c < row.cells.length; c++) if (row.cells[c]) return true;
  return false;
}

// Vecinos rellenos a distancia de contacto (incluye piedras).
function neighborsFilled(r, c) {
  const row = grid[r];
  if (!row) return [];
  const out = [];
  const cx = cellX(row.parity, c), cy = cellY(r);
  for (let rr = r - 1; rr <= r + 1; rr++) {
    if (rr < 0 || rr >= grid.length) continue;
    const rw = grid[rr];
    const cand = rr === r ? [c - 1, c + 1] : [c - 1, c, c + 1];
    for (let k = 0; k < cand.length; k++) {
      const cc = cand[k];
      if (cc < 0 || cc >= rw.cells.length) continue;
      if (!rw.cells[cc]) continue;
      const dx = cellX(rw.parity, cc) - cx;
      const dy = cellY(rr) - cy;
      if (dx * dx + dy * dy <= (D + 2) * (D + 2)) out.push([rr, cc]);
    }
  }
  return out;
}

function hasNeighborBubble(r, c) {
  const row = grid[r];
  if (!row) return false;
  const cx = cellX(row.parity, c), cy = cellY(r);
  for (let rr = r - 1; rr <= r + 1; rr++) {
    if (rr < 0 || rr >= grid.length) continue;
    const rw = grid[rr];
    const cand = rr === r ? [c - 1, c + 1] : [c - 1, c, c + 1];
    for (let k = 0; k < cand.length; k++) {
      const cc = cand[k];
      if (cc < 0 || cc >= rw.cells.length) continue;
      if (!rw.cells[cc]) continue;
      const dx = cellX(rw.parity, cc) - cx;
      const dy = cellY(rr) - cy;
      if (dx * dx + dy * dy <= (D + 2) * (D + 2)) return true;
    }
  }
  return false;
}

function sameColor(a, b) {
  if (!a || !b || a.stone || b.stone) return false;
  if (a.wild || b.wild) return true;
  return a.color === b.color;
}

function lowestBubbleBottom() {
  let max = 0;
  forEachBubble((cell, r, c, x, y) => { if (y + R > max) max = y + R; });
  return max;
}

// ---------- Construcción de niveles ----------
function buildLevel(idx) {
  const L = LEVELS[idx];
  gridTop = L.gridTop || GRID_TOP;
  grid = [];
  for (let r = 0; r < L.rows; r++) grid.push(blankRow(r % 2));

  for (let r = 0; r < L.rows; r++) {
    const row = grid[r], n = row.cells.length;
    for (let c = 0; c < n; c++) {
      const x = cellX(row.parity, c);
      const pal = L.palette;
      let cell = null;
      if (L.pattern === 'bands') {
        if ((c + r * 2) % 9 === 0) continue;
        cell = { color: pal[Math.floor(c / 2 + r) % pal.length] };
      } else if (L.pattern === 'spiral') {
        if ((c + r * 2) % 7 === 3) continue;
        cell = { color: pal[(c * 2 + r) % pal.length] };
      } else if (L.pattern === 'fortress') {
        if (r >= 2 && c % 8 === 6) continue;
        if (r === 3 && c % 9 === 4) continue;
        cell = { color: pal[(Math.floor(c / 2) + r * 3) % pal.length] };
        if ((r === 2 || r === 3) && (c === 3 || c === 4 || c === n - 5 || c === n - 4)) {
          cell = { stone: true };
        }
      } else if (L.pattern === 'boss') {
        if (Math.abs(x - W / 2) < 150) continue;
        if ((c + r * 2) % 11 === 0) continue;
        cell = { color: pal[(Math.floor(c / 2) + r) % pal.length] };
        if (r >= 2 && r <= 3 && Math.abs(Math.abs(x - W / 2) - 165) < 22) {
          cell = { stone: true };
        }
      }
      row.cells[c] = cell;
    }
  }

  // Coloca burbujas de poder de forma determinista.
  const pool = [];
  forEachBubble((cell, r, c) => { if (!cell.stone) pool.push([r, c]); });
  const rnd = mulberry32(1207 + idx * 977);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  const nPu = Math.min(L.powerups, pool.length);
  for (let i = 0; i < nPu; i++) {
    const pos = pool[i];
    grid[pos[0]].cells[pos[1]].pu = PU_TYPES[i % PU_TYPES.length];
  }
}

// ---------- Carga y reinicio ----------
function loadLevel(idx) {
  levelIdx = clamp(idx, 0, LEVELS.length - 1);
  const L = LEVELS[levelIdx];
  buildLevel(levelIdx);
  shot = null;
  particles = [];
  floats = [];
  shake = 0;
  transitionT = 0;
  refillT = 0;
  shotsUntilDrop = L.dropEvery;
  angle = -Math.PI / 2;
  puTimers = { rainbow: 0, guide: 0, freeze: 0 };
  puShots = { bomb: false };
  boss = null;

  if (L.boss) {
    boss = {
      x: W / 2, y: 112, r: 44,
      hp: 30, maxHp: 30,
      color: L.palette[0], palette: L.palette.slice(),
      colorT: 6, flash: 0, bob: 0,
      dying: false, deathT: 0,
    };
  }
  currentBubble = makeBubble();
  nextBubble = makeBubble();
  state = 'ready';
  saveMaxLevel();
  updateHud();
}

function resetGame() {
  score = 0;
  lives = 3;
  levelIdx = 0;
  scoreSubmitted = false;
  paused = false;
  keys.left = false;
  keys.right = false;
  loadLevel(0);
  updateHud();
}

function continueLevel() {
  if (state !== 'gameover') return;
  lives = 3;
  scoreSubmitted = false;
  paused = false;
  loadLevel(levelIdx);
  updateHud();
}

function beginPlay() {
  if (state !== 'ready') return;
  state = 'playing';
  refillT = 0;
  beep(660, 0.08, 0.08, 'triangle');
  updateHud();
}

// ---------- Gestión de burbujas ----------
function randomPaletteColor() {
  const pal = LEVELS[levelIdx].palette;
  return pal[Math.floor(Math.random() * pal.length)];
}

function availableColors() {
  const set = new Set();
  forEachBubble((cell) => { if (!cell.stone) set.add(cell.color); });
  if (boss && !boss.dying) set.add(boss.color);
  if (!set.size) LEVELS[levelIdx].palette.forEach((c) => set.add(c));
  return Array.from(set);
}

function makeBubble() {
  const cs = availableColors();
  return { color: cs[Math.floor(Math.random() * cs.length)] };
}

function aimAt(x, y) {
  const dx = x - SHOOTER_X, dy = y - SHOOTER_Y;
  let a = Math.atan2(dy, dx);
  if (a > 0) a = dx >= 0 ? MAX_ANGLE : MIN_ANGLE;
  angle = clamp(a, MIN_ANGLE, MAX_ANGLE);
}

function tryShoot() {
  if (state !== 'playing' || paused || shot || refillT > 0) return;
  const wild = puTimers.rainbow > 0;
  const bomb = puShots.bomb;
  if (bomb) puShots.bomb = false;
  shot = {
    x: SHOOTER_X, y: SHOOTER_Y - R,
    vx: Math.cos(angle) * SHOT_SPEED,
    vy: Math.sin(angle) * SHOT_SPEED,
    color: currentBubble.color,
    wild: wild,
    bomb: bomb,
    trail: [],
  };
  currentBubble = nextBubble;
  nextBubble = makeBubble();
  shootSound();
  updateHud();
}

// ---------- Colisiones ----------
function hitsBubbleAt(x, y) {
  const rr = (D - 2) * (D - 2);
  for (let r = 0; r < grid.length; r++) {
    const row = grid[r];
    if (!row) continue;
    const y0 = cellY(r);
    if (Math.abs(y0 - y) > D) continue;
    for (let c = 0; c < row.cells.length; c++) {
      if (!row.cells[c]) continue;
      const dx = cellX(row.parity, c) - x;
      const dy = y0 - y;
      if (dx * dx + dy * dy < rr) return { r: r, c: c };
    }
  }
  return null;
}

function hitsBossAt(x, y) {
  return !!(boss && !boss.dying && Math.hypot(x - boss.x, y - boss.y) < boss.r + R);
}

// ---------- Partículas y textos ----------
function spawnBurst(x, y, color, n, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (0.8 + Math.random() * 3.4) * (power || 1);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6,
      life: 24 + Math.random() * 22, max: 46,
      color: color, r: 1.4 + Math.random() * 2.8, grav: 0.075,
    });
  }
  if (particles.length > 420) particles.splice(0, particles.length - 420);
}

function addFloat(x, y, text, color, life) {
  floats.push({ x: x, y: y, text: text, color: color, life: life || 60, vy: -0.45 });
  if (floats.length > 24) floats.shift();
}

// ---------- Power-ups ----------
function activatePowerup(type, x, y) {
  if (type === 'bomb') puShots.bomb = true;
  else if (type === 'rainbow') puTimers.rainbow = 12 * 60;
  else if (type === 'guide') puTimers.guide = 12 * 60;
  else if (type === 'freeze') puTimers.freeze = 10 * 60;
  if (PU_SOUND[type]) PU_SOUND[type]();
  addFloat(x, y - 6, PU_LABEL[type] || type, PU_COLOR[type] || '#fff', 80);
  score += 25;
  saveHigh();
  updateHud();
}

// ---------- Anexar disparo y resolver grupos ----------
function attachShot() {
  trimEmptyRows();
  const maxR = Math.min(MAX_ROWS, grid.length);
  ensureRows(maxR + 1);
  let best = null, bestD = Infinity;

  for (let r = 0; r <= maxR; r++) {
    const row = grid[r];
    const y0 = cellY(r);
    if (Math.abs(y0 - shot.y) > ROW_H * 2.4) continue;
    for (let c = 0; c < row.cells.length; c++) {
      if (row.cells[c]) continue;
      if (r > 0 && !hasNeighborBubble(r, c)) continue;
      const dx = cellX(row.parity, c) - shot.x;
      const dy = y0 - shot.y;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = { r: r, c: c }; }
    }
  }

  if (!best) {
    for (let r = 0; r <= maxR && !best; r++) {
      const row = grid[r];
      for (let c = 0; c < row.cells.length; c++) {
        if (row.cells[c]) continue;
        const dx = cellX(row.parity, c) - shot.x;
        const dy = cellY(r) - shot.y;
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = { r: r, c: c }; }
      }
    }
  }
  if (!best) return;

  const row = grid[best.r];
  row.cells[best.c] = { color: shot.color, wild: shot.wild || undefined };
  const bx = cellX(row.parity, best.c), by = cellY(best.r);
  spawnBurst(bx, by, shot.wild ? '#ffffff' : BUBBLE_COLORS[shot.color], 5, 0.7);
  stickSound();
  resolveMatches(best.r, best.c);
  checkOverflow();
  if (state === 'playing') checkLevelClear();
}

function resolveMatches(r0, c0) {
  const row0 = grid[r0];
  if (!row0 || !row0.cells[c0]) return;
  const start = row0.cells[c0];
  const visited = new Set();
  const stack = [[r0, c0]];
  const group = [];
  visited.add(r0 + ',' + c0);
  while (stack.length) {
    const cur = stack.pop();
    group.push(cur);
    const ns = neighborsFilled(cur[0], cur[1]);
    for (let i = 0; i < ns.length; i++) {
      const key = ns[i][0] + ',' + ns[i][1];
      if (visited.has(key)) continue;
      const cell = grid[ns[i][0]].cells[ns[i][1]];
      if (!cell || !sameColor(start, cell)) continue;
      visited.add(key);
      stack.push(ns[i]);
    }
  }
  if (group.length < 3) return;

  const toActivate = [];
  for (let i = 0; i < group.length; i++) {
    const r = group[i][0], c = group[i][1];
    const cell = grid[r].cells[c];
    const bx = cellX(grid[r].parity, c), by = cellY(r);
    if (cell.pu) toActivate.push({ type: cell.pu, x: bx, y: by });
    spawnBurst(bx, by, cell.stone ? STONE_COLOR : (cell.wild ? '#ffffff' : BUBBLE_COLORS[cell.color]), 7, 1);
    grid[r].cells[c] = null;
  }
  const extra = Math.max(0, group.length - 3) * 15;
  score += group.length * 10 + extra;
  if (extra > 0) addFloat(cellX(row0.parity, c0), cellY(r0) - 10, '+' + (group.length * 10 + extra), '#ffd23f', 55);
  popSound(group.length);
  shake = Math.max(shake, 2 + group.length * 0.4);
  if (boss && !boss.dying) {
    damageBoss(1 + Math.floor((group.length - 3) / 3), cellX(row0.parity, c0), cellY(r0));
  }
  dropFloating(true);
  for (let i = 0; i < toActivate.length; i++) {
    activatePowerup(toActivate[i].type, toActivate[i].x, toActivate[i].y);
  }
  saveHigh();
  saveMaxLevel();
  updateHud();
}

function dropFloating(award) {
  const connected = new Set();
  const stack = [];
  if (grid[0]) {
    for (let c = 0; c < grid[0].cells.length; c++) {
      if (grid[0].cells[c]) {
        connected.add('0,' + c);
        stack.push([0, c]);
      }
    }
  }
  while (stack.length) {
    const cur = stack.pop();
    const ns = neighborsFilled(cur[0], cur[1]);
    for (let i = 0; i < ns.length; i++) {
      const key = ns[i][0] + ',' + ns[i][1];
      if (connected.has(key)) continue;
      connected.add(key);
      stack.push(ns[i]);
    }
  }
  const floating = [];
  forEachBubble((cell, r, c, x, y) => {
    if (!connected.has(r + ',' + c)) floating.push({ r: r, c: c, cell: cell, x: x, y: y });
  });
  if (!floating.length) return 0;

  let gained = 0;
  for (let i = 0; i < floating.length; i++) {
    const f = floating[i];
    spawnBurst(f.x, f.y, f.cell.stone ? STONE_COLOR : (f.cell.wild ? '#fff' : BUBBLE_COLORS[f.cell.color]), 6, 1.1);
    if (award) gained += f.cell.stone ? 25 : 20;
    grid[f.r].cells[f.c] = null;
  }
  if (award) {
    score += gained;
    addFloat(W / 2, 250, '¡CADENA! +' + gained, '#3ddc97', 70);
    saveHigh();
  }
  dropSound();
  shake = Math.max(shake, 7);
  updateHud();
  return floating.length;
}

// ---------- Bomba ----------
function explodeBomb(x, y) {
  const radius = R * 4.0;
  const targets = [];
  const toActivate = [];
  forEachBubble((cell, r, c, bx, by) => {
    if (cell.stone) return;
    const dx = bx - x, dy = by - y;
    if (dx * dx + dy * dy <= radius * radius) targets.push({ r: r, c: c, cell: cell, x: bx, y: by });
  });
  for (let i = 0; i < targets.length; i++) {
    const tg = targets[i];
    if (tg.cell.pu) toActivate.push({ type: tg.cell.pu, x: tg.x, y: tg.y });
    spawnBurst(tg.x, tg.y, tg.cell.stone ? STONE_COLOR : (tg.cell.wild ? '#fff' : BUBBLE_COLORS[tg.cell.color]), 8, 1.3);
    grid[tg.r].cells[tg.c] = null;
  }
  if (targets.length) {
    score += targets.length * 15;
    addFloat(x, y - 20, '¡BOOM! +' + (targets.length * 15), '#ff9f1c', 65);
    noise(0.4, 0.22);
    shake = Math.max(shake, 11);
    for (let i = 0; i < 18; i++) spawnBurst(x, y, '#ff9f1c', 2, 1.6);
  } else {
    noise(0.2, 0.1);
  }
  dropFloating(true);
  for (let i = 0; i < toActivate.length; i++) {
    activatePowerup(toActivate[i].type, toActivate[i].x, toActivate[i].y);
  }
  saveHigh();
  updateHud();
}

// ---------- Jefe ----------
function bossColorHex() {
  return boss ? BUBBLE_COLORS[boss.color] : '#fff';
}

function damageBoss(dmg, x, y) {
  if (!boss || boss.dying || dmg <= 0) return;
  boss.hp -= dmg;
  boss.flash = 1;
  score += dmg * 50;
  shake = Math.max(shake, 6);
  addFloat(x, y - 14, '-' + dmg, '#ffd23f', 55);
  spawnBurst(x, y, bossColorHex(), 12, 1.4);
  beep(220 - Math.min(120, dmg * 8), 0.16, 0.16, 'sawtooth');
  if (boss.hp <= 0) {
    boss.hp = 0;
    boss.dying = true;
    boss.deathT = 110;
    noise(0.6, 0.3);
    fanfare();
    addFloat(W / 2, 220, '¡DOH DERROTADO!', '#ffd23f', 120);
  }
  saveHigh();
  updateHud();
}

function cycleBossColor() {
  if (!boss || boss.dying) return;
  boss.colorT--;
  if (boss.colorT > 0) return;
  const pal = boss.palette;
  const i = pal.indexOf(boss.color);
  boss.color = pal[(i + 1) % pal.length];
  boss.colorT = 6;
  beep(880, 0.07, 0.06, 'sine');
  addFloat(boss.x, boss.y + boss.r + 16, 'CAMBIO DE COLOR', bossColorHex(), 45);
}

// ---------- Techo ----------
function addCeilingRow() {
  const L = LEVELS[levelIdx];
  if (!grid.length) grid.push(blankRow(0));
  const parity = 1 - grid[0].parity;
  const row = blankRow(parity);
  for (let c = 0; c < row.cells.length; c++) {
    const x = cellX(parity, c);
    if (L.boss && Math.abs(x - W / 2) < 130) continue;
    if (Math.random() < 0.12) continue;
    row.cells[c] = { color: randomPaletteColor() };
  }
  grid.unshift(row);
  shake = Math.max(shake, 6);
  noise(0.18, 0.09);
  addFloat(W / 2, gridTop - 12, '¡EL TECHO BAJA!', '#ff9f1c', 65);
  checkOverflow();
}

// ---------- Vida perdida ----------
function bubbleOverflow() {
  if (state !== 'playing') return;
  lives--;
  noise(0.35, 0.22);
  shake = 16;
  shot = null;
  addFloat(W / 2, 330, '¡TABLERO DESBORDADO!', '#ff2e63', 90);

  if (lives <= 0) {
    state = 'gameover';
    saveHigh();
    submitScore();
    updateHud();
    return;
  }

  const reliefY = DANGER_Y - ROW_H * 2;
  let guard = 0;
  while (lowestBubbleBottom() > reliefY && guard < 10) {
    let bottom = -1;
    for (let r = 0; r < grid.length; r++) if (rowHasAny(r)) bottom = r;
    if (bottom < 0) break;
    grid[bottom].cells.fill(null);
    guard++;
  }
  dropFloating(false);
  trimEmptyRows();

  puTimers = { rainbow: 0, guide: 0, freeze: 0 };
  puShots = { bomb: false };
  shotsUntilDrop = LEVELS[levelIdx].dropEvery;
  refillT = 35;
  currentBubble = nextBubble || makeBubble();
  nextBubble = makeBubble();
  saveHigh();
  updateHud();
}

function checkOverflow() {
  if (state !== 'playing') return;
  if (boss && boss.dying) return;
  if (lowestBubbleBottom() > DANGER_Y) bubbleOverflow();
}

function checkLevelClear() {
  if (state !== 'playing') return false;
  if (LEVELS[levelIdx].boss) return false;
  if (countBubbles() > 0) return false;
  score += 250;
  saveHigh();
  saveMaxLevel();
  transitionT = 120;
  state = 'transition';
  arpeggio();
  updateHud();
  return true;
}

// ---------- Turno ----------
function resolveTurn() {
  if (state !== 'playing') return;
  shot = null;
  if (checkLevelClear()) return;
  trimEmptyRows();

  if (puTimers.freeze <= 0 && !(boss && boss.dying)) {
    shotsUntilDrop--;
    if (shotsUntilDrop <= 0) {
      addCeilingRow();
      shotsUntilDrop = LEVELS[levelIdx].dropEvery;
      if (state !== 'playing') return;
    }
  }
  checkOverflow();
  if (state !== 'playing') return;
  cycleBossColor();
  refillT = 8;
  updateHud();
}

function updateShot() {
  if (!shot) return;
  const steps = Math.max(1, Math.ceil(SHOT_SPEED / 4));
  for (let s = 0; s < steps; s++) {
    shot.x += shot.vx / steps;
    shot.y += shot.vy / steps;

    if (shot.x < R) { shot.x = R; shot.vx = Math.abs(shot.vx); }
    if (shot.x > W - R) { shot.x = W - R; shot.vx = -Math.abs(shot.vx); }

    if (hitsBossAt(shot.x, shot.y)) {
      const match = shot.wild || shot.color === boss.color;
      const dmg = shot.bomb ? 5 : (match ? 4 : 1);
      spawnBurst(shot.x, shot.y, bossColorHex(), 12, 1.3);
      if (match) addFloat(shot.x, shot.y - 22, '¡IMPACTO PERFECTO!', '#ffd23f', 55);
      else addFloat(shot.x, shot.y - 22, 'COLOR INCORRECTO', '#8b97ad', 45);
      damageBoss(dmg, shot.x, shot.y);
      shot = null;
      resolveTurn();
      return;
    }

    let impact = shot.y <= gridTop + 1;
    if (!impact) impact = !!hitsBubbleAt(shot.x, shot.y);
    if (impact) {
      if (shot.bomb) explodeBomb(shot.x, shot.y);
      else attachShot();
      shot = null;
      resolveTurn();
      return;
    }
  }
  shot.trail.push({ x: shot.x, y: shot.y });
  if (shot.trail.length > 8) shot.trail.shift();
}

function rotateAim(dir) {
  angle = clamp(angle + dir * 0.045, MIN_ANGLE, MAX_ANGLE);
}

function winGame() {
  if (state === 'won') return;
  state = 'won';
  paused = false;
  score += 1000;
  saveHigh();
  saveMaxLevel();
  submitScore();
  addFloat(W / 2, 230, '¡VICTORIA! +1000', '#ffd23f', 150);
  arpeggio();
  updateHud();
}

function update() {
  t++;
  if (paused) return;

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    s.y += s.sp;
    if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; }
  }
  for (let i = 0; i < drifters.length; i++) {
    const d = drifters[i];
    d.x += d.vx;
    d.y += d.vy;
    d.ph += 0.004;
    if (d.y < -d.r) { d.y = H + d.r; d.x = Math.random() * W; }
    if (d.x < -d.r) d.x = W + d.r;
    if (d.x > W + d.r) d.x = -d.r;
  }

  if (shake > 0) {
    shake *= 0.88;
    if (shake < 0.25) shake = 0;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.grav;
    p.vx *= 0.985;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y += f.vy;
    f.vy *= 0.985;
    f.life--;
    if (f.life <= 0) floats.splice(i, 1);
  }

  if (boss) {
    boss.bob = Math.sin(t * 0.045) * 4;
    if (boss.flash > 0.01) boss.flash *= 0.9;
  }

  if (state === 'playing') {
    if (keys.left) rotateAim(-1);
    if (keys.right) rotateAim(1);
    if (refillT > 0) refillT--;
    if (puTimers.rainbow > 0) puTimers.rainbow--;
    if (puTimers.guide > 0) puTimers.guide--;
    if (puTimers.freeze > 0) puTimers.freeze--;
    if (t % 30 === 0) updateHud();

    updateShot();

    if (boss && boss.dying && state === 'playing') {
      boss.deathT--;
      if (t % 5 === 0) {
        spawnBurst(
          boss.x + (Math.random() - 0.5) * boss.r * 1.7,
          boss.y + (Math.random() - 0.5) * boss.r * 1.7,
          bossColorHex(), 9, 1.6
        );
        noise(0.12, 0.06);
        shake = Math.max(shake, 7);
      }
      if (boss.deathT <= 0) winGame();
    }
  } else if (state === 'ready') {
    if (keys.left) rotateAim(-1);
    if (keys.right) rotateAim(1);
  } else if (state === 'transition') {
    transitionT--;
    if (transitionT <= 0) {
      if (levelIdx + 1 < LEVELS.length) loadLevel(levelIdx + 1);
      else { state = 'won'; submitScore(); }
    }
  }
}

// ---------- Dibujo ----------
function draw() {
  drawBackground();

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawAim();
  drawGrid();
  drawBoss();
  drawDangerLine();
  drawShot();
  drawShooter();
  drawParticles();
  ctx.restore();

  drawUI();
  drawFloats();
  drawOverlays();
}

function drawBackground() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0f22');
  bg.addColorStop(0.55, '#0a0918');
  bg.addColorStop(1, '#05060c');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const tw = 0.55 + 0.45 * Math.sin(t * 0.02 + i);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = i % 7 === 0 ? '#a78bfa' : '#dce6ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (let i = 0; i < drifters.length; i++) {
    const d = drifters[i];
    ctx.globalAlpha = d.a * (0.7 + 0.3 * Math.sin(d.ph + t * 0.01));
    ctx.fillStyle = d.col;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Marco lateral del campo de juego.
  ctx.strokeStyle = 'rgba(167,139,250,.22)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(2, 50); ctx.lineTo(2, H - 74);
  ctx.moveTo(W - 2, 50); ctx.lineTo(W - 2, H - 74);
  ctx.stroke();

  // Techo (solo en niveles sin jefe).
  if (!LEVELS[levelIdx].boss) {
    ctx.strokeStyle = 'rgba(167,139,250,.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(4, gridTop - R - 2);
    ctx.lineTo(W - 4, gridTop - R - 2);
    ctx.stroke();
    for (let i = 0; i < 14; i++) {
      const x = 20 + i * 56;
      ctx.fillStyle = 'rgba(167,139,250,.25)';
      ctx.fillRect(x, gridTop - R - 4, 10, 3);
    }
  }

  const vig = ctx.createRadialGradient(W / 2, H * 0.45, 180, W / 2, H * 0.45, 520);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function simulateTrajectory() {
  const pts = [];
  let x = SHOOTER_X, y = SHOOTER_Y - R;
  let vx = Math.cos(angle), vy = Math.sin(angle);
  let bounces = 0;
  for (let i = 0; i < 240; i++) {
    x += vx * 5;
    y += vy * 5;
    if (x < R) { x = R; vx = -vx; bounces++; pts.push({ x: x, y: y }); if (bounces > 3) break; continue; }
    if (x > W - R) { x = W - R; vx = -vx; bounces++; pts.push({ x: x, y: y }); if (bounces > 3) break; continue; }
    if (y < 8) break;
    if (y <= gridTop || hitsBossAt(x, y) || hitsBubbleAt(x, y)) { pts.push({ x: x, y: y }); break; }
    if (i % 2 === 0) pts.push({ x: x, y: y });
  }
  return pts;
}

function drawAim() {
  if (state !== 'playing' && state !== 'ready') return;
  const guide = puTimers.guide > 0;
  const color = guide ? 'rgba(76,194,255,.85)' : 'rgba(220,230,255,.45)';

  ctx.save();
  if (!guide) {
    ctx.setLineDash([3, 7]);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(SHOOTER_X, SHOOTER_Y - R);
    ctx.lineTo(SHOOTER_X + Math.cos(angle) * 88, SHOOTER_Y - R + Math.sin(angle) * 88);
    ctx.stroke();
    ctx.setLineDash([]);
  } else {
    const pts = simulateTrajectory();
    ctx.fillStyle = 'rgba(76,194,255,.42)';
    for (let i = 0; i < pts.length; i += 2) {
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, 2.1, 0, Math.PI * 2);
      ctx.fill();
    }
    if (pts.length) {
      const last = pts[pts.length - 1];
      ctx.strokeStyle = 'rgba(76,194,255,.9)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(last.x, last.y, R * 0.75, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  ctx.fillStyle = 'rgba(255,255,255,.75)';
  const tipX = SHOOTER_X + Math.cos(angle) * (R + 6);
  const tipY = SHOOTER_Y + Math.sin(angle) * (R + 6);
  ctx.beginPath();
  ctx.arc(tipX, tipY, 2.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawGrid() {
  for (let r = 0; r < grid.length; r++) {
    const row = grid[r];
    if (!row) continue;
    const y = cellY(r);
    for (let c = 0; c < row.cells.length; c++) {
      const cell = row.cells[c];
      if (!cell) continue;
      const x = cellX(row.parity, c);
      let spr;
      if (cell.stone) spr = spriteCache.stone;
      else if (cell.wild) spr = spriteCache.wild;
      else spr = spriteCache[cell.color] || spriteCache[0];
      ctx.drawImage(spr, x - SPR_C, y - SPR_C);
      if (cell.pu) drawPowerBadge(x, y, cell.pu, r + c);
    }
  }
}

function drawPowerBadge(x, y, type, seed) {
  const col = PU_COLOR[type] || '#fff';
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.09 + seed);
  ctx.save();
  ctx.globalAlpha = 0.45 + 0.45 * pulse;
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, R + 2.5, 0, Math.PI * 2);
  ctx.stroke();

  ctx.globalAlpha = 1;
  const bx = x + 10, by = y + 10;
  ctx.fillStyle = '#05070d';
  ctx.beginPath();
  ctx.arc(bx, by, 7.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.fillStyle = col;
  ctx.font = 'bold 9px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(PU_ICON[type] || '?', bx, by + 0.5);
  ctx.restore();
}

function drawBoss() {
  if (!boss) return;
  const bx = boss.x;
  const by = boss.y + boss.bob;
  const col = bossColorHex();

  ctx.save();
  if (boss.dying) ctx.globalAlpha = 0.65 + 0.35 * Math.sin(t * 0.9);

  const glow = ctx.createRadialGradient(bx, by, boss.r * 0.4, bx, by, boss.r * 1.75);
  glow.addColorStop(0, col + '44');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(bx, by, boss.r * 1.75, 0, Math.PI * 2);
  ctx.fill();

  const body = ctx.createRadialGradient(bx - 16, by - 18, 4, bx, by, boss.r);
  body.addColorStop(0, shade(col, 0.85));
  body.addColorStop(0.42, col);
  body.addColorStop(1, shade(col, -0.6));
  ctx.fillStyle = body;
  ctx.shadowColor = col;
  ctx.shadowBlur = 26;
  ctx.beginPath();
  ctx.arc(bx, by, boss.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = 'rgba(5,7,13,.85)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(bx, by, boss.r - 1, 0, Math.PI * 2);
  ctx.stroke();

  // Ojos.
  const eo = 15, ey = by - 10;
  ctx.fillStyle = '#f4f8ff';
  ctx.beginPath(); ctx.arc(bx - eo, ey, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(bx + eo, ey, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111827';
  ctx.beginPath(); ctx.arc(bx - eo + 2, ey + 1, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(bx + eo + 2, ey + 1, 3.4, 0, Math.PI * 2); ctx.fill();

  // Ceño enfadado.
  ctx.strokeStyle = 'rgba(17,24,39,.8)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(bx - 25, by - 24); ctx.lineTo(bx - 7, by - 18);
  ctx.moveTo(bx + 25, by - 24); ctx.lineTo(bx + 7, by - 18);
  ctx.stroke();

  // Boca.
  ctx.strokeStyle = 'rgba(17,24,39,.75)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(bx, by + 17, 13, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();

  // Aro del color actual.
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 7]);
  ctx.beginPath();
  ctx.arc(bx, by, boss.r + 7, t * 0.01, t * 0.01 + Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  if (boss.flash > 0.02) {
    ctx.globalAlpha = boss.flash * 0.7;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(bx, by, boss.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawDangerLine() {
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.06);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,46,99,' + (0.35 + 0.4 * pulse) + ')';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 7]);
  ctx.beginPath();
  ctx.moveTo(8, DANGER_Y);
  ctx.lineTo(W - 8, DANGER_Y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,46,99,.55)';
  ctx.font = '9px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText('LÍNEA DE PELIGRO', 12, DANGER_Y - 5);
  ctx.restore();
}

function drawShot() {
  if (!shot) return;
  for (let i = 0; i < shot.trail.length; i++) {
    const p = shot.trail[i];
    ctx.globalAlpha = (i + 1) / shot.trail.length * 0.32;
    ctx.fillStyle = shot.wild ? '#ffffff' : BUBBLE_COLORS[shot.color];
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4 + i * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  let spr;
  if (shot.bomb) spr = spriteCache.bomb;
  else if (shot.wild) spr = spriteCache.wild;
  else spr = spriteCache[shot.color] || spriteCache[0];
  ctx.drawImage(spr, shot.x - SPR_C, shot.y - SPR_C);
}

function drawShooter() {
  const sx = SHOOTER_X, sy = SHOOTER_Y;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + 18, 52, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(angle + Math.PI / 2);
  const barrel = ctx.createLinearGradient(-9, 0, 9, 0);
  barrel.addColorStop(0, '#3a4357');
  barrel.addColorStop(0.45, '#9aa7bd');
  barrel.addColorStop(0.55, '#c8d4e6');
  barrel.addColorStop(1, '#2c3444');
  ctx.fillStyle = barrel;
  ctx.beginPath();
  ctx.roundRect(-9, -46, 18, 42, 6);
  ctx.fill();
  ctx.fillStyle = '#1a2130';
  ctx.beginPath();
  ctx.roundRect(-12, -48, 24, 9, 4);
  ctx.fill();
  ctx.strokeStyle = 'rgba(167,139,250,.7)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-12, -48); ctx.lineTo(12, -48);
  ctx.stroke();
  ctx.restore();

  const base = ctx.createRadialGradient(sx - 10, sy - 6, 4, sx, sy, 36);
  base.addColorStop(0, '#4a5570');
  base.addColorStop(0.55, '#232b3c');
  base.addColorStop(1, '#0c111c');
  ctx.fillStyle = base;
  ctx.beginPath();
  ctx.arc(sx, sy, 32, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(167,139,250,.65)';
  ctx.lineWidth = 2;
  ctx.stroke();

  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + t * 0.01;
    ctx.fillStyle = 'rgba(167,139,250,.45)';
    ctx.beginPath();
    ctx.arc(sx + Math.cos(a) * 25, sy + Math.sin(a) * 25, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  let curSpr;
  if (puShots.bomb) curSpr = spriteCache.bomb;
  else if (puTimers.rainbow > 0) curSpr = spriteCache.wild;
  else if (currentBubble) curSpr = spriteCache[currentBubble.color] || spriteCache[0];
  if (curSpr) {
    ctx.save();
    if (puShots.bomb) {
      ctx.shadowColor = '#ff9f1c';
      ctx.shadowBlur = 18;
    } else if (puTimers.rainbow > 0) {
      ctx.shadowColor = '#ffd23f';
      ctx.shadowBlur = 16;
    }
    ctx.drawImage(curSpr, sx - SPR_C, sy - SPR_C);
    ctx.restore();
  }

  // Burbuja siguiente.
  const nx = sx + 82, ny = sy + 2;
  ctx.fillStyle = 'rgba(139,151,173,.8)';
  ctx.font = '9px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('SIGUIENTE', nx, ny - 26);
  if (nextBubble) {
    const spr = spriteCache[nextBubble.color] || spriteCache[0];
    const sc = 0.58;
    ctx.globalAlpha = 0.92;
    ctx.drawImage(spr, nx - SPR_C * sc, ny - SPR_C * sc, SPR_SIZE * sc, SPR_SIZE * sc);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawParticles() {
  if (!particles.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.6 + 0.4 * a), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawUI() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px "Courier New", monospace';
  ctx.shadowColor = 'rgba(167,139,250,.8)';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#f2f5ff';
  ctx.fillText(pad(score, 5), W / 2, 29);
  ctx.shadowBlur = 0;

  ctx.textAlign = 'left';
  ctx.font = '10px "Courier New", monospace';
  ctx.fillStyle = 'rgba(139,151,173,.9)';
  ctx.fillText(LEVELS[levelIdx].name, 12, 16);

  ctx.textAlign = 'right';
  if (puTimers.freeze > 0) {
    ctx.fillStyle = '#a8f0ff';
    ctx.fillText('TECHO CONGELADO', W - 12, 16);
  } else {
    const low = shotsUntilDrop <= 2;
    const pulse = 0.55 + 0.45 * Math.sin(t * 0.2);
    ctx.fillStyle = low ? 'rgba(255,46,99,' + pulse + ')' : '#ff9f1c';
    ctx.fillText('TECHO EN ' + shotsUntilDrop, W - 12, 16);
  }

  if (boss) {
    const bx = 258, by = 46, bw = 300, bh = 11;
    ctx.fillStyle = 'rgba(8,11,20,.85)';
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 5);
    ctx.fill();
    const pct = clamp(boss.hp / boss.maxHp, 0, 1);
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, '#ff2e63');
    grad.addColorStop(0.55, '#ff9f1c');
    grad.addColorStop(1, bossColorHex());
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(bx + 1, by + 1, Math.max(0, (bw - 2) * pct), bh - 2, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 5);
    ctx.stroke();

    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = bossColorHex();
    ctx.fillText('DOH', bx - 8, by + bh / 2);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd23f';
    ctx.fillText(Math.ceil(boss.hp) + '/' + boss.maxHp, bx + bw + 8, by + bh / 2);
  }
  ctx.restore();
}

function drawFloats() {
  for (let i = 0; i < floats.length; i++) {
    const f = floats[i];
    const a = clamp(f.life / 30, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(5,7,13,.8)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
}

function drawOverlays() {
  if (state === 'playing' && !paused) return;

  ctx.save();
  ctx.fillStyle = 'rgba(5,7,13,.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (paused && state === 'playing') {
    ctx.font = 'bold 34px "Courier New", monospace';
    ctx.fillStyle = '#a78bfa';
    ctx.shadowColor = 'rgba(167,139,250,.8)';
    ctx.shadowBlur = 18;
    ctx.fillText('PAUSA', W / 2, 260);
    ctx.shadowBlur = 0;
    ctx.font = '13px "Courier New", monospace';
    ctx.fillStyle = '#dbe3f5';
    ctx.fillText('P o ESC para continuar', W / 2, 310);
    ctx.fillStyle = '#8b97ad';
    ctx.fillText('R: reiniciar el nivel', W / 2, 334);
  } else if (state === 'ready') {
    const L = LEVELS[levelIdx];
    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.fillStyle = '#a78bfa';
    ctx.shadowColor = 'rgba(167,139,250,.8)';
    ctx.shadowBlur = 18;
    ctx.fillText(L.name, W / 2, 190);

    ctx.shadowBlur = 0;
    ctx.font = '14px "Courier New", monospace';
    ctx.fillStyle = '#dbe3f5';
    ctx.fillText(L.boss ? 'DERROTA A DOH CON IMPACTOS DE SU COLOR' : 'HAZ ESTALLAR GRUPOS DE 3 O MÁS BURBUJAS', W / 2, 246);
    ctx.fillStyle = '#8b97ad';
    ctx.font = '12px "Courier New", monospace';
    ctx.fillText('APUNTA CON EL RATÓN, EL DEDO O LAS FLECHAS', W / 2, 274);
    ctx.fillText('LOS GRUPOS SIN APOYO TAMBIÉN CAEN', W / 2, 296);

    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText('ESPACIO / CLIC / TOQUE PARA EMPEZAR', W / 2, 360);
    ctx.fillStyle = 'rgba(139,151,173,.75)';
    ctx.font = '10px "Courier New", monospace';
    ctx.fillText('P: PAUSA   ·   C: CONTINUAR   ·   R: REINICIAR', W / 2, 392);

    // Paleta del nivel.
    const pal = LEVELS[levelIdx].palette;
    for (let i = 0; i < pal.length; i++) {
      const x = W / 2 + (i - (pal.length - 1) / 2) * 30;
      ctx.fillStyle = BUBBLE_COLORS[pal[i]];
      ctx.beginPath();
      ctx.arc(x, 430, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.45)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  } else if (state === 'transition') {
    ctx.font = 'bold 30px "Courier New", monospace';
    ctx.fillStyle = '#3ddc97';
    ctx.shadowColor = 'rgba(61,220,151,.8)';
    ctx.shadowBlur = 18;
    ctx.fillText('NIVEL COMPLETADO', W / 2, 250);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('+250 PUNTOS', W / 2, 296);
    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#8b97ad';
    if (levelIdx + 1 < LEVELS.length) {
      ctx.fillText('PREPARANDO ' + LEVELS[levelIdx + 1].name, W / 2, 336);
    }
  } else if (state === 'gameover') {
    ctx.font = 'bold 36px "Courier New", monospace';
    ctx.fillStyle = '#ff2e63';
    ctx.shadowColor = 'rgba(255,46,99,.8)';
    ctx.shadowBlur = 18;
    ctx.fillText('GAME OVER', W / 2, 220);
    ctx.shadowBlur = 0;
    ctx.font = '14px "Courier New", monospace';
    ctx.fillStyle = '#dbe3f5';
    ctx.fillText('PUNTUACIÓN: ' + pad(score, 5), W / 2, 272);
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('RÉCORD: ' + pad(highScore, 5), W / 2, 298);
    ctx.fillStyle = '#3ddc97';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText('C o CLIC: CONTINUAR EL NIVEL ' + (levelIdx + 1), W / 2, 350);
    ctx.fillStyle = '#8b97ad';
    ctx.font = '12px "Courier New", monospace';
    ctx.fillText('R: REINICIAR LA PARTIDA', W / 2, 378);
  } else if (state === 'won') {
    ctx.font = 'bold 36px "Courier New", monospace';
    ctx.fillStyle = '#ffd23f';
    ctx.shadowColor = 'rgba(255,210,63,.8)';
    ctx.shadowBlur = 20;
    ctx.fillText('¡VICTORIA!', W / 2, 210);
    ctx.shadowBlur = 0;
    ctx.font = '13px "Courier New", monospace';
    ctx.fillStyle = '#dbe3f5';
    ctx.fillText('LA BURBUJA MADRE HA CAÍDO', W / 2, 252);
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('PUNTUACIÓN: ' + pad(score, 5), W / 2, 300);
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('RÉCORD: ' + pad(highScore, 5), W / 2, 328);
    ctx.fillStyle = '#3ddc97';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText('R o CLIC: VOLVER A JUGAR', W / 2, 382);
  }
  ctx.restore();
}

// ---------- Entrada ----------
function canvasPos(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (W / Math.max(1, r.width)),
    y: (clientY - r.top) * (H / Math.max(1, r.height)),
  };
}

function restartLevel() {
  paused = false;
  keys.left = false;
  keys.right = false;
  loadLevel(levelIdx);
  updateHud();
}

canvas.addEventListener('mousemove', (e) => {
  if (state === 'playing' || state === 'ready') {
    const p = canvasPos(e.clientX, e.clientY);
    aimAt(p.x, p.y);
  }
});

canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  resumeAudio();
  const p = canvasPos(e.clientX, e.clientY);
  if (state === 'ready') {
    aimAt(p.x, p.y);
    beginPlay();
  } else if (state === 'playing') {
    if (paused) { paused = false; return; }
    aimAt(p.x, p.y);
    tryShoot();
  } else if (state === 'gameover') {
    continueLevel();
  } else if (state === 'won') {
    resetGame();
  }
});

let touchPlaying = false;
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  resumeAudio();
  const touch = e.changedTouches[0];
  if (!touch) return;
  const p = canvasPos(touch.clientX, touch.clientY);
  if (state === 'ready') {
    aimAt(p.x, p.y);
    beginPlay();
    touchPlaying = false;
  } else if (state === 'playing') {
    if (paused) { paused = false; touchPlaying = false; return; }
    aimAt(p.x, p.y);
    touchPlaying = true;
  } else if (state === 'gameover') {
    continueLevel();
    touchPlaying = false;
  } else if (state === 'won') {
    resetGame();
    touchPlaying = false;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (state !== 'playing' && state !== 'ready') return;
  const touch = e.touches[0];
  if (!touch) return;
  const p = canvasPos(touch.clientX, touch.clientY);
  aimAt(p.x, p.y);
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (touchPlaying && state === 'playing' && !paused) tryShoot();
  touchPlaying = false;
}, { passive: false });

canvas.addEventListener('touchcancel', () => { touchPlaying = false; });

function eventCode(e) {
  if (e.code) return e.code;
  const k = e.key;
  if (k === ' ' || k === 'Spacebar') return 'Space';
  if (k === 'Esc') return 'Escape';
  if (k && k.length === 1) {
    if (/[a-zA-Z]/.test(k)) return 'Key' + k.toUpperCase();
    if (/[0-9]/.test(k)) return 'Digit' + k;
  }
  return k || '';
}

window.addEventListener('keydown', (e) => {
  const code = eventCode(e);
  if (code === 'ArrowLeft' || code === 'ArrowRight' || code === 'Space') e.preventDefault();

  if (code === 'ArrowLeft' || code === 'KeyA') keys.left = true;
  if (code === 'ArrowRight' || code === 'KeyD') keys.right = true;

  if (code === 'Space' && !e.repeat) {
    resumeAudio();
    if (state === 'ready') beginPlay();
    else if (state === 'playing') {
      if (paused) paused = false;
      else tryShoot();
    } else if (state === 'gameover') {
      continueLevel();
    } else if (state === 'won') {
      resetGame();
    }
  }

  if (code === 'KeyP' || code === 'Escape') {
    if (state === 'playing') {
      paused = !paused;
      if (paused) { keys.left = false; keys.right = false; }
    }
  }

  if (code === 'KeyC' && state === 'gameover') continueLevel();

  if (code === 'KeyR') {
    if (state === 'gameover' || state === 'won') resetGame();
    else if (state === 'transition') loadLevel(Math.min(LEVELS.length - 1, levelIdx + 1));
    else restartLevel();
  }
});

window.addEventListener('keyup', (e) => {
  const code = eventCode(e);
  if (code === 'ArrowLeft' || code === 'KeyA') keys.left = false;
  if (code === 'ArrowRight' || code === 'KeyD') keys.right = false;
});

window.addEventListener('blur', () => {
  keys.left = false;
  keys.right = false;
});

btnRestart.addEventListener('click', () => {
  resumeAudio();
  if (state === 'gameover' || state === 'won') resetGame();
  else restartLevel();
  btnRestart.blur();
});

// ---------- Bucle principal ----------
const STEP = 1000 / 60;

function loop(ts) {
  if (!lastTime) lastTime = ts;
  let dt = ts - lastTime;
  lastTime = ts;
  if (dt > 250) dt = 250;
  acc += dt;

  let steps = 0;
  while (acc >= STEP && steps < 5) {
    update();
    acc -= STEP;
    steps++;
  }
  if (steps >= 5) acc = 0;

  draw();
  requestAnimationFrame(loop);
}

// ---------- Inicio ----------
t = 0;
lastTime = 0;
acc = 0;
buildSprites();
initBackground();
resetGame();
requestAnimationFrame(loop);
})();
</script>
